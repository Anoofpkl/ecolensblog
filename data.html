<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLens Admin — Manage Posts</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600,500&f[]=satoshi@900,700,500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface-alt: #222;
            --text: #f0ece4;
            --text-secondary: #a0a0a0;
            --accent: #ff6b6b;
            --accent-glow: rgba(255,107,107,0.35);
            --accent2: #00e0a8;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 8px 30px rgba(0,0,0,0.4);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Satoshi', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        h1, h2, h3 { font-family: 'Clash Display', sans-serif; }
        a { color: var(--accent); text-decoration: none; }
        button { cursor: pointer; font-family: inherit; }

        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--surface); border-bottom: 1px solid var(--border); }
        .navbar .logo { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 50px; font-weight: 600; border: none; transition: var(--transition); display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover { transform: translateY(-2px); box-shadow: 0 5px 20px var(--accent-glow); }
        .btn-danger { background: transparent; border: 2px solid #ff4d4d; color: #ff4d4d; }
        .btn-danger:hover { background: #ff4d4d; color: #fff; }

        .login-card { max-width: 420px; margin: 5rem auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem; box-shadow: var(--shadow); }
        .login-card h2 { margin-bottom: 1.5rem; font-size: 1.8rem; }
        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; margin-bottom: 0.4rem; font-weight: 500; color: var(--text-secondary); font-size: 0.9rem; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 0.7rem 1rem; border-radius: 50px; border: 2px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 0.95rem; transition: var(--transition); }
        .input-group textarea { border-radius: var(--radius-sm); min-height: 120px; resize: vertical; }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-color: var(--accent); }

        .posts-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
        .post-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1.2rem; display: flex; justify-content: space-between; align-items: center; transition: var(--transition); }
        .post-item:hover { border-color: var(--accent); }
        .post-info h3 { font-size: 1.1rem; margin-bottom: 0.2rem; }
        .post-info .meta { font-size: 0.8rem; color: var(--text-secondary); display: flex; gap: 1rem; }
        .post-actions { display: flex; gap: 0.5rem; }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-secondary); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: var(--surface); border-radius: var(--radius); padding: 2rem; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
        .modal-content h2 { margin-bottom: 1.5rem; }
        .form-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem; }

        .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--accent); color: #fff; padding: 0.8rem 1.5rem; border-radius: 50px; font-weight: 600; box-shadow: 0 5px 20px var(--accent-glow); z-index: 2000; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Eco<span class="logo-dot"></span>Lens <span style="font-size:0.9rem;margin-left:0.5rem;color:var(--text-secondary);">Admin</span></div>
        <div>
            <span id="userEmail" style="margin-right:1rem;color:var(--text-secondary);"></span>
            <button class="btn btn-outline" id="logoutBtn" style="display:none;"><i class="ri-logout-box-line"></i> Logout</button>
        </div>
    </nav>

    <div class="container">
        <!-- Login form (new credentials pre‑filled) -->
        <div id="loginSection" class="login-card">
            <h2>🔐 Admin Login</h2>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" value="ankpkl500@gmail.com" placeholder="ankpkl500@gmail.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" value="PQ+upT_Qw4P?4Tj" placeholder="Enter password">
            </div>
            <button class="btn btn-accent" onclick="handleLogin()" style="width:100%;">Sign In</button>
            <p id="loginError" style="color:var(--accent);margin-top:0.8rem;font-size:0.9rem;"></p>
            <p style="color:var(--text-secondary);font-size:0.75rem;margin-top:1rem;text-align:center;">
                ⚠️ Ensure this user exists in Supabase (Authentication → Users).
            </p>
        </div>

        <!-- Admin dashboard (hidden initially) -->
        <div id="adminSection" class="hidden">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
                <h2>📰 Posts Management</h2>
                <button class="btn btn-accent" onclick="openAddModal()"><i class="ri-add-line"></i> New Post</button>
            </div>
            <div id="postsList" class="posts-list"></div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="postModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">New Post</h2>
            <input type="hidden" id="postId">
            <div class="input-group"><label>Title</label><input type="text" id="postTitle" placeholder="Article title"></div>
            <div class="input-group"><label>Slug</label><input type="text" id="postSlug" placeholder="url-friendly-slug"></div>
            <div class="input-group"><label>Excerpt</label><textarea id="postExcerpt" rows="2" placeholder="Short description..."></textarea></div>
            <div class="input-group"><label>Content (full article)</label><textarea id="postContent" rows="5" placeholder="Full blog content..."></textarea></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="input-group"><label>Tag</label><input type="text" id="postTag" placeholder="Economics, Climate..."></div>
                <div class="input-group"><label>Emoji Icon</label><input type="text" id="postEmoji" placeholder="📰" maxlength="2"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="input-group"><label>Read Time (min)</label><input type="number" id="postReadTime" value="5"></div>
                <div class="input-group"><label>Views</label><input type="number" id="postViews" value="0"></div>
            </div>
            <div class="form-actions">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn btn-accent" onclick="savePost()">Save Post</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Your Supabase credentials
        const SUPABASE_URL = 'https://ojlmwlqrkbctlpexrufs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_2aMsITRDeO8MfFHiWIkNzQ_JENBP08R';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) { currentUser = session.user; showAdmin(); }
            else { showLogin(); }
        }

        function showLogin() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('userEmail').textContent = '';
        }

        function showAdmin() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            document.getElementById('logoutBtn').style.display = 'inline-flex';
            document.getElementById('userEmail').textContent = currentUser.email;
            loadPosts();
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            document.getElementById('loginError').textContent = '';
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) { document.getElementById('loginError').textContent = error.message; }
            else { currentUser = data.user; showAdmin(); }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            currentUser = null;
            showLogin();
        }

        async function loadPosts() {
            const { data: posts, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('postsList');
            if (error) { container.innerHTML = '<p class="empty-state">Failed to load posts.</p>'; return; }
            if (!posts || posts.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 No posts yet. Create your first one!</div>';
                return;
            }
            container.innerHTML = posts.map(post => `
                <div class="post-item">
                    <div class="post-info">
                        <h3>${post.image_emoji || '📰'} ${post.title}</h3>
                        <div class="meta">
                            <span>${post.tag || 'No tag'}</span>
                            <span>${post.read_time} min read</span>
                            <span>${post.views} views</span>
                            <span>${new Date(post.created_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                    <div class="post-actions">
                        <button class="btn btn-outline" onclick="editPost(${post.id})"><i class="ri-edit-line"></i></button>
                        <button class="btn btn-danger" onclick="deletePost(${post.id})"><i class="ri-delete-bin-line"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function openAddModal() {
            document.getElementById('postId').value = '';
            document.getElementById('modalTitle').textContent = 'New Post';
            document.getElementById('postTitle').value = '';
            document.getElementById('postSlug').value = '';
            document.getElementById('postExcerpt').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postTag').value = '';
            document.getElementById('postEmoji').value = '📰';
            document.getElementById('postReadTime').value = 5;
            document.getElementById('postViews').value = 0;
            document.getElementById('postModal').classList.remove('hidden');
        }

        async function editPost(id) {
            const { data: post, error } = await supabase.from('posts').select('*').eq('id', id).single();
            if (error) return alert('Error loading post');
            document.getElementById('postId').value = post.id;
            document.getElementById('modalTitle').textContent = 'Edit Post';
            document.getElementById('postTitle').value = post.title;
            document.getElementById('postSlug').value = post.slug;
            document.getElementById('postExcerpt').value = post.excerpt || '';
            document.getElementById('postContent').value = post.content || '';
            document.getElementById('postTag').value = post.tag || '';
            document.getElementById('postEmoji').value = post.image_emoji || '📰';
            document.getElementById('postReadTime').value = post.read_time;
            document.getElementById('postViews').value = post.views;
            document.getElementById('postModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('postModal').classList.add('hidden'); }

        async function savePost() {
            const id = document.getElementById('postId').value;
            const postData = {
                title: document.getElementById('postTitle').value,
                slug: document.getElementById('postSlug').value,
                excerpt: document.getElementById('postExcerpt').value,
                content: document.getElementById('postContent').value,
                tag: document.getElementById('postTag').value,
                image_emoji: document.getElementById('postEmoji').value,
                read_time: parseInt(document.getElementById('postReadTime').value) || 5,
                views: parseInt(document.getElementById('postViews').value) || 0
            };
            if (!postData.slug) postData.slug = postData.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            let error;
            if (id) ({ error } = await supabase.from('posts').update(postData).eq('id', id));
            else ({ error } = await supabase.from('posts').insert([postData]));
            if (error) alert('Error saving post: ' + error.message);
            else { closeModal(); loadPosts(); showToast(id ? 'Post updated!' : 'Post created!'); }
        }

        async function deletePost(id) {
            if (!confirm('Delete this post permanently?')) return;
            const { error } = await supabase.from('posts').delete().eq('id', id);
            if (error) alert('Delete failed: ' + error.message);
            else { loadPosts(); showToast('Post deleted'); }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        document.getElementById('postTitle').addEventListener('input', function() {
            const slugInput = document.getElementById('postSlug');
            if (!document.getElementById('postId').value) slugInput.value = this.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        });

        document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        window.addEventListener('click', (e) => { if (e.target === document.getElementById('postModal')) closeModal(); });
        checkSession();
    </script>
</body>
</html>
