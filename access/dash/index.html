<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dashboard · ECOLENS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('ecolens-admin-theme');
                var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0e;
            --bg-secondary: #111118;
            --bg-card: #16161f;
            --bg-card-hover: #1c1c28;
            --border: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.12);
            --text: #f0ede8;
            --text-secondary: rgba(240, 237, 232, 0.65);
            --text-tertiary: rgba(240, 237, 232, 0.35);
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.25);
            --lime: #c9ff3d;
            --lime-glow: rgba(201, 255, 61, 0.15);
            --coral: #ff6b4a;
            --coral-glow: rgba(255, 107, 74, 0.15);
            --cyan: #5bd8ff;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        :root[data-theme="light"] {
            --bg: #f7f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f5;
            --border: #e4e4ec;
            --border-strong: #cfcfdb;
            --text: #14141a;
            --text-secondary: #4a4a58;
            --text-tertiary: #84848f;
            --accent: #6c3ce0;
            --accent-glow: rgba(108, 60, 224, 0.1);
            --lime: #5c8a00;
            --lime-glow: rgba(92, 138, 0, 0.1);
            --coral: #d6492c;
            --coral-glow: rgba(214, 73, 44, 0.1);
            --cyan: #0077be;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        body,
        .panel,
        .post-item {
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ::selection {
            background: var(--accent);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ── utilities ── */
        .wrap {
            max-width: none;
            padding: 0;
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        /* ── buttons ── */
        button {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            padding: 12px 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active {
            transform: scale(0.97);
        }
        button:focus-visible {
            outline: 2px solid var(--lime);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--lime);
            color: #0a0a0e;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 20px var(--lime-glow);
        }
        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 28px var(--lime-glow);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border-color: var(--border-strong);
        }

        .btn-danger {
            background: rgba(255, 107, 74, 0.08);
            color: var(--coral);
            border: 1px solid rgba(255, 107, 74, 0.2);
        }
        .btn-danger:hover {
            background: rgba(255, 107, 74, 0.16);
            border-color: var(--coral);
            box-shadow: 0 0 20px var(--coral-glow);
        }

        .btn-small {
            font-size: 12px;
            padding: 7px 14px;
            border-radius: 8px;
        }

        .btn-outline-accent {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .btn-outline-accent:hover {
            background: rgba(124, 92, 255, 0.1);
        }

        .error-msg {
            color: var(--coral);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            min-height: 18px;
            margin: -4px 0 14px;
        }
        .status-msg {
            color: var(--lime);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            min-height: 18px;
            margin: -4px 0 14px;
        }

        /* ── dashboard ── */
        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 6px 8px 6px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
        }
        .user-badge .avatar {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
        }
        .user-badge .pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: var(--accent);
            color: #fff;
            padding: 3px 12px;
            border-radius: 999px;
            opacity: 0.85;
        }
        .user-badge .pill.draft {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        /* ── panel ── */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: var(--shadow);
            transition: border-color var(--transition);
        }
        .panel:hover {
            border-color: var(--border-strong);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .panel-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-header .pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: var(--accent);
            color: #fff;
            padding: 3px 12px;
            border-radius: 999px;
            opacity: 0.85;
        }
        .panel-header .pill.draft {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }
        .panel-header .pill.editing {
            background: var(--lime);
            color: #0a0a0e;
        }

        /* ── form ── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-secondary);
        }

        .field input,
        .field textarea,
        .field select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            width: 100%;
        }
        .field input:focus,
        .field textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .field input::placeholder,
        .field textarea::placeholder {
            color: var(--text-tertiary);
        }
        .field textarea {
            min-height: 180px;
            resize: vertical;
            line-height: 1.6;
            font-size: 14px;
        }
        .field input[type="number"] {
            max-width: 140px;
        }

        .slug-preview {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--lime);
            padding: 4px 0 2px;
            word-break: break-all;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .form-actions .btn-primary {
            width: auto;
            min-width: 140px;
        }
        .form-actions .btn-ghost {
            width: auto;
        }

        .empty-state {
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 28px 0 12px;
            text-align: center;
        }
        .empty-state .big {
            font-size: 38px;
            display: block;
            margin-bottom: 12px;
        }

        .loading-state {
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .loading-state .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 999px;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 640px) {
            .panel {
                padding: 20px 16px;
            }
            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .form-actions .btn-primary {
                min-width: unset;
            }
        }

        .body-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .body-mode-toggle {
            display: inline-flex;
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            padding: 3px;
            gap: 2px;
        }
        .body-mode-toggle .mode-btn {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .body-mode-toggle .mode-btn:hover { color: var(--text); }
        .body-mode-toggle .mode-btn.active { background: var(--accent); color: #fff; }
        #f-content.html-mode {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
        }

        /* ── image upload ── */
        .image-upload {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .image-preview {
            width: 84px;
            height: 84px;
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            border: 1px dashed var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            font-size: 26px;
            color: var(--text-tertiary);
        }
        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .image-upload-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .file-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            transition: all var(--transition);
            width: fit-content;
        }
        .file-btn:hover {
            color: var(--text);
            border-color: var(--accent);
            background: rgba(124, 92, 255, 0.08);
        }
        .file-btn input[type="file"] {
            display: none;
        }
        .remove-image-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--coral);
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            padding: 0;
            width: fit-content;
            opacity: 0.85;
        }
        .remove-image-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }
        .upload-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .category-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .category-row .cat-name {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--text);
        }
        .category-row .cat-slug {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-tertiary);
            flex: 1;
        }
        .category-row button {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: rgba(255, 107, 74, 0.08);
            color: var(--coral);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .category-row button:hover {
            background: rgba(255, 107, 74, 0.16);
        }

        /* ── site settings panel ── */
        .nav-link-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .nav-link-row input {
            background: var(--bg-secondary);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 9px 12px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }
        .nav-link-row input.nl-label {
            flex: 1;
            min-width: 0;
        }
        .nav-link-row input.nl-href {
            flex: 1.4;
            min-width: 0;
        }
        .nav-link-row button {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: rgba(255, 107, 74, 0.08);
            color: var(--coral);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-link-row button:hover {
            background: rgba(255, 107, 74, 0.16);
        }
        .add-nav-link-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--accent);
            background: rgba(124, 92, 255, 0.08);
            border: 1px solid rgba(124, 92, 255, 0.3);
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            margin-top: 4px;
        }
        .add-nav-link-btn:hover {
            background: rgba(124, 92, 255, 0.16);
        }

        /* ── anims ── */
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── wordpress-style admin shell ── */
        .wp-shell {
            display: flex;
            min-height: 100vh;
        }

        .wp-sidebar {
            width: 210px;
            flex-shrink: 0;
            background: #1d2327;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .wp-sidebar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .wp-sidebar-brand .dot {
            color: var(--lime);
        }
        .wp-nav {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            flex: 1;
        }
        .wp-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 20px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Inter', sans-serif;
            font-size: 13.5px;
            font-weight: 500;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            transition: background var(--transition), color var(--transition);
        }
        .wp-nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .wp-nav-item.active {
            background: var(--accent);
            color: #fff;
        }
        .wp-sidebar-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 0;
            display: flex;
            flex-direction: column;
        }

        .wp-main {
            flex: 1;
            min-width: 0;
            background: var(--bg);
        }
        .wp-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 32px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            flex-wrap: wrap;
        }
        .wp-topbar h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 600;
        }
        .wp-content {
            padding: 28px 32px 64px;
            max-width: 980px;
        }
        .wp-screen {
            display: none;
        }
        .wp-screen.active {
            display: block;
        }

        @media (max-width: 860px) {
            .wp-sidebar {
                width: 64px;
            }
            .wp-sidebar-brand,
            .wp-nav-item span.label {
                display: none;
            }
            .wp-nav-item {
                justify-content: center;
                padding: 13px 0;
            }
            .wp-topbar {
                padding: 16px 18px;
            }
            .wp-content {
                padding: 20px 16px 48px;
            }
        }

        /* ── posts table (wp list table style) ── */
        .wp-table-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .wp-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .wp-table thead th {
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        .wp-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
        }
        .wp-table tbody tr:last-child {
            border-bottom: none;
        }
        .wp-table tbody tr:hover {
            background: var(--bg-card-hover);
        }
        .wp-table td {
            padding: 13px 16px;
            vertical-align: middle;
        }
        .wp-table .post-title-cell {
            font-weight: 600;
            color: var(--text);
        }
        .wp-table .post-title-cell .emoji {
            margin-right: 6px;
        }
        .wp-table .row-actions {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 3px;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .wp-table tbody tr:hover .row-actions {
            opacity: 1;
        }
        .wp-table .row-actions button {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            padding: 0;
        }
        .wp-table .row-actions button.danger {
            color: var(--coral);
        }
        .wp-table .row-actions .sep {

            const slugInput = document.getElementById('f-slug');

            function updateSlugPreview() {
                const val = slugInput.value || slugify(titleInput.value) || '…';
                slugPreview.textContent = 'index.html?post=' + val;
            }

            titleInput.addEventListener('input', () => {
                if (!slugManuallyEdited) slugInput.value = slugify(titleInput.value);
                updateSlugPreview();
            });
            slugInput.addEventListener('input', () => {
                slugManuallyEdited = true;
                slugInput.value = slugify(slugInput.value);
                updateSlugPreview();
            });
            updateSlugPreview();

            // ── cover image upload ──
            let currentImageUrl = '';
            let pendingImageFile = null;
            const imagePreview = document.getElementById('image-preview');
            const removeImageBtn = document.getElementById('remove-image-btn');
            const uploadStatus = document.getElementById('upload-status');

            function renderImagePreview() {
                if (pendingImageFile) {
                    imagePreview.innerHTML = `<img src="${URL.createObjectURL(pendingImageFile)}" />`;
                    removeImageBtn.style.display = 'block';
                } else if (currentImageUrl) {
                    imagePreview.innerHTML = `<img src="${currentImageUrl}" />`;
                    removeImageBtn.style.display = 'block';
                } else {
                    imagePreview.innerHTML = '🖼';
                    removeImageBtn.style.display = 'none';
                }
            }

            document.getElementById('f-image').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                pendingImageFile = file;
                uploadStatus.textContent = '';
                renderImagePreview();
            });

            removeImageBtn.addEventListener('click', () => {
                pendingImageFile = null;
                currentImageUrl = '';
                document.getElementById('f-image').value = '';
                uploadStatus.textContent = '';
                renderImagePreview();
            });

            // ── category select ──
            loadCategoryOptions();

            // ── compose / html mode toggle (Blogger-style) ──
            const bodyModeHint = document.getElementById('body-mode-hint');
            const isHtmlInput = document.getElementById('f-is-html');
            function setBodyMode(mode) {
                isHtmlInput.value = mode === 'html' ? 'true' : 'false';
                document.querySelectorAll('.body-mode-toggle .mode-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.mode === mode);
                });
                contentArea.classList.toggle('html-mode', mode === 'html');
                bodyModeHint.textContent = mode === 'html'
                    ? '(raw HTML — inserted directly into the page, no escaping)'
                    : '(separate paragraphs with a blank line)';
            }
            document.querySelectorAll('.body-mode-toggle .mode-btn').forEach(btn => {
                btn.addEventListener('click', () => setBodyMode(btn.dataset.mode));
            });

            // ── insert image into post body ──
            const contentArea = document.getElementById('f-content');
            const inlineImageStatus = document.getElementById('inline-image-status');

            document.getElementById('f-inline-image').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                inlineImageStatus.textContent = 'uploading…';
                try {
                    const url = await uploadToStorage(file, 'inline');
                    const cursorPos = contentArea.selectionStart ?? contentArea.value.length;
                    const before = contentArea.value.slice(0, cursorPos);
                    const after = contentArea.value.slice(cursorPos);
                    const isHtml = isHtmlInput.value === 'true';
                    let insertText;
                    if (isHtml) {
                        insertText = `\n<img src="${url}" alt="" style="width:100%;border-radius:10px;" />\n`;
                    } else {
                        const needsLeadingBreak = before && !before.endsWith('\n\n') ? (before.endsWith('\n') ? '\n' :
                            '\n\n') : '';
                        insertText = `${needsLeadingBreak}[image:${url}]\n\n`;
                    }
                    contentArea.value = before + insertText + after;
                    const newPos = (before + insertText).length;
                    contentArea.focus();
                    contentArea.setSelectionRange(newPos, newPos);
                    inlineImageStatus.textContent = '✓ inserted';
                    setTimeout(() => { inlineImageStatus.textContent = ''; }, 2500);
                } catch (err) {
                    inlineImageStatus.textContent = 'upload failed: ' + err.message;
                }
                e.target.value = '';
            });

            // ── cancel edit ──
            document.getElementById('cancel-edit-btn').addEventListener('click', () => resetForm());

            // ── submit ──
            document.getElementById('post-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errEl = document.getElementById('form-error');
                const statusEl = document.getElementById('form-status');
                const saveBtn = document.getElementById('save-btn');
                errEl.textContent = '';
                statusEl.textContent = '';

                const editId = document.getElementById('edit-id').value;
                const title = titleInput.value.trim();
                const slug = slugify(slugInput.value || titleInput.value);

                if (!title || !slug) {
                    errEl.textContent = 'Title and slug are required.';
                    return;
                }

                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> ' + (editId ?
                    'Saving…' : 'Publishing…');

                // upload cover image if a new file was chosen
                if (pendingImageFile) {
                    uploadStatus.textContent = 'uploading image…';
                    try {
                        currentImageUrl = await uploadToStorage(pendingImageFile, 'posts');
                        pendingImageFile = null;
                        uploadStatus.textContent = '';
                    } catch (uploadErr) {
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = 'Publish';
                        uploadStatus.textContent = '';
                        errEl.textContent = 'Image upload failed: ' + uploadErr.message;
                        return;
                    }
                }

                const payload = {
                    title,
                    slug,
                    tag: document.getElementById('f-tag').value.trim() || 'econ',
                    image_emoji: document.getElementById('f-emoji').value.trim() || '📰',
                    image_url: currentImageUrl || null,
                    author_name: document.getElementById('f-author').value.trim() || sessionName,
                    excerpt: document.getElementById('f-excerpt').value.trim(),
                    read_time: parseInt(document.getElementById('f-readtime').value, 10) || 5,
                    content: document.getElementById('f-content').value.trim(),
                    is_html: document.getElementById('f-is-html').value === 'true',
                };

                let result;
                if (editId) {
                    result = await supabase.from('posts').update(payload).eq('id', editId).select();
                } else {
                    result = await supabase.from('posts').insert(payload).select();
                }

                saveBtn.disabled = false;
                saveBtn.innerHTML = 'Publish';

                if (result.error) {
                    if (result.error.code === '23505') {
                        errEl.textContent = 'That slug is already taken — pick a different one.';
                    } else {
                        errEl.textContent = result.error.message;
                    }
                    return;
                }

                statusEl.textContent = editId ? '✓ Saved.' : '✓ Published.';
                setTimeout(() => { statusEl.textContent = ''; }, 4000);
                resetForm();
                loadPostList();
            });

            // ── reset form ──
            function resetForm() {
                document.getElementById('post-form').reset();
                document.getElementById('edit-id').value = '';
                document.getElementById('f-readtime').value = 5;
                document.getElementById('editor-heading').innerHTML = 'New post <span class="pill draft">draft</span>';
                document.getElementById('cancel-edit-btn').style.display = 'none';
                slugManuallyEdited = false;
                updateSlugPreview();
                document.getElementById('form-error').textContent = '';
                document.getElementById('form-status').textContent = '';
                currentImageUrl = '';
                pendingImageFile = null;
                uploadStatus.textContent = '';
                renderImagePreview();
                loadCategoryOptions();
                setBodyMode('compose');
            }

            // ── load posts ──
            async function loadPostList() {
                const listEl = document.getElementById('post-list');
                const countEl = document.getElementById('post-count');

                const { data, error } = await supabase
                    .from('posts')
                    .select('id, title, slug, tag, views, created_at, image_emoji, author_name')
                    .order('created_at', { ascending: false });

                if (error) {
                    listEl.innerHTML =
                        `<div class="empty-state">couldn't load posts: ${escapeHtml(error.message)}</div>`;
                    return;
                }
                if (!data || data.length === 0) {
                    listEl.innerHTML =
                        `<div class="empty-state"><span class="big">📭</span>No posts yet. Write your first one above.</div>`;
                    countEl.textContent = '';
                    return;
                }

                countEl.textContent = data.length + ' post' + (data.length > 1 ? 's' : '');

                listEl.innerHTML = `
                <div class="wp-table-wrap">
                  <table class="wp-table">
                    <thead>
                      <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Views</th>
                        <th>Date</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${data.map(p => `
                        <tr data-id="${p.id}">
                          <td>
                            <div class="post-title-cell">
                              <span class="emoji">${escapeHtml(p.image_emoji || '📄')}</span>${escapeHtml(p.title)}
                            </div>
                            <div class="row-actions">
                              <button data-action="edit" data-id="${p.id}">Edit</button>
                              <span class="sep">|</span>
                              <button class="danger" data-action="delete" data-id="${p.id}" data-title="${escapeHtml(p.title)}">Delete</button>
                              <span class="sep">|</span>
                              <a href="../../index.html?post=${encodeURIComponent(p.slug)}" target="_blank" rel="noopener" style="color:var(--text-tertiary);">View</a>
                            </div>
                          </td>
                          <td class="date-cell">${escapeHtml(p.author_name || '—')}</td>
                          <td><span class="cat-pill">${escapeHtml(p.tag || 'econ')}</span></td>
                          <td class="views-cell">👁 ${p.views || 0}</td>
                          <td class="date-cell">${new Date(p.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `;

                // edit
                listEl.querySelectorAll('[data-action="edit"]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const { data: post, error } = await supabase.from('posts').select('*').eq('id',
                            btn.dataset.id).single();
                        if (error || !post) return;
                        document.getElementById('edit-id').value = post.id;
                        document.getElementById('f-title').value = post.title || '';
                        document.getElementById('f-slug').value = post.slug || '';
                        loadCategoryOptions(post.tag || '');
                        document.getElementById('f-emoji').value = post.image_emoji || '';
                        document.getElementById('f-author').value = post.author_name || '';
                        document.getElementById('f-excerpt').value = post.excerpt || '';
                        document.getElementById('f-readtime').value = post.read_time || 5;
                        document.getElementById('f-content').value = post.content || '';
                        setBodyMode(post.is_html ? 'html' : 'compose');
                        currentImageUrl = post.image_url || '';
                        pendingImageFile = null;

                listEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm(`Delete "${btn.dataset.title}"? This can't be undone.`)) return;

            loadPostList();
            initFormsPanel();
