            if (currentUserRole === 'admin') initSettingsPanel();
        }

        // ─── COMMENTS ───────────────────────────────────────
        async function loadComments() {
            const listEl = document.getElementById('comments-list');
            const countEl = document.getElementById('comment-count');
            if (!listEl) return;

            const { data, error } = await supabase
                .from('comments')
                .select('id, name, body, approved, created_at, post_id, posts(title, slug)')
                .order('created_at', { ascending: false });

            if (error) {
                listEl.innerHTML = `<div class="empty-state">couldn't load comments: ${escapeHtml(error.message)}</div>`;
                return;
            }
            if (!data || data.length === 0) {
                listEl.innerHTML = `<div class="empty-state"><span class="big">💬</span>No comments yet.</div>`;
                countEl.textContent = '';
                return;
            }

            countEl.textContent = data.length + ' comment' + (data.length > 1 ? 's' : '');

            listEl.innerHTML = data.map(c => `
              <div class="comment-row" data-id="${c.id}">
                <div class="c-head">
                  <span class="c-name">${escapeHtml(c.name)}</span>
                  <span class="c-post">on ${escapeHtml(c.posts?.title || 'a post')}</span>
                  <span class="c-status ${c.approved ? 'approved' : ''}">${c.approved ? 'approved' : 'pending'}</span>
                </div>
                <div class="c-body">${escapeHtml(c.body)}</div>
                <div class="c-actions">
                  ${c.approved
                    ? `<button type="button" class="btn-ghost btn-small" data-action="unapprove" data-id="${c.id}">Unapprove</button>`
                    : `<button type="button" class="btn-outline-accent btn-small" data-action="approve" data-id="${c.id}">Approve</button>`}
                  <button type="button" class="btn-danger btn-small" data-action="delete-comment" data-id="${c.id}">Delete</button>
                </div>
              </div>
            `).join('');

            listEl.querySelectorAll('[data-action="approve"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await supabase.from('comments').update({ approved: true }).eq('id', btn.dataset.id);
                    loadComments();
                });
            });
            listEl.querySelectorAll('[data-action="unapprove"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await supabase.from('comments').update({ approved: false }).eq('id', btn.dataset.id);
                    loadComments();
                });
            });
            listEl.querySelectorAll('[data-action="delete-comment"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Delete this comment?')) return;
                    await supabase.from('comments').delete().eq('id', btn.dataset.id);
                    loadComments();
                });
            });
        }

        // ─── ADMINS ─────────────────────────────────────────
        async function loadAdmins() {
            const listEl = document.getElementById('admins-list');
            if (!listEl) return;

            const { data, error } = await supabase.from('admins').select('email, name, role, added_at').order('added_at',
                { ascending: true });

            if (error) {
                listEl.innerHTML = `<div class="empty-state">couldn't load admins: ${escapeHtml(error.message)}</div>`;
                return;
            }

            const { data: { session } } = await supabase.auth.getSession();
            const currentEmail = session?.user?.email;

            listEl.innerHTML = (data || []).map(a => `
              <div class="admin-row" data-email="${escapeHtml(a.email)}">
                <div class="a-avatar">${escapeHtml((a.name || a.email).slice(0, 2))}</div>
                <div class="a-info">
                  <div class="a-name">${escapeHtml(a.name || a.email)}</div>
                  <div class="a-email">${escapeHtml(a.email)}</div>
                </div>
                ${a.email === currentEmail
                    ? `<span class="pill published">${a.role === 'admin' ? 'Admin' : 'Author'} · you</span>`
                    : `<select class="role-select" data-role-email="${escapeHtml(a.email)}" style="margin-right:8px;">
                         <option value="admin" ${a.role === 'admin' ? 'selected' : ''}>Admin</option>
                         <option value="author" ${a.role !== 'admin' ? 'selected' : ''}>Author</option>
                       </select>
                       <button type="button" class="btn-danger btn-small" data-remove-admin="${escapeHtml(a.email)}">Remove</button>`}
              </div>
            `).join('') || '<div class="empty-state">No admins yet.</div>';

            listEl.querySelectorAll('[data-role-email]').forEach(sel => {
                sel.addEventListener('change', async () => {
                    const email = sel.dataset.roleEmail;
                    const { error: roleErr } = await supabase.from('admins').update({ role: sel.value }).eq('email', email);
                    if (roleErr) {
                        alert('Could not update role: ' + roleErr.message);
                        loadAdmins();
                        return;
                    }
                });
            });

            listEl.querySelectorAll('[data-remove-admin]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm(`Remove access for ${btn.dataset.removeAdmin}?`)) return;
                    await supabase.from('admins').delete().eq('email', btn.dataset.removeAdmin);
                    loadAdmins();
                });
            });

            const addBtn = document.getElementById('add-admin-btn');
            if (addBtn && !addBtn.dataset.bound) {
                addBtn.dataset.bound = '1';
                addBtn.addEventListener('click', async () => {
                    const nameInput = document.getElementById('new-admin-name');
                    const emailInput = document.getElementById('new-admin-email');
                    const roleInput = document.getElementById('new-admin-role');
                    const errEl = document.getElementById('admin-error');
                    const statusEl = document.getElementById('admin-status');
                    errEl.textContent = '';
                    statusEl.textContent = '';

                    const name = nameInput.value.trim();
                    const email = emailInput.value.trim().toLowerCase();
                    const role = roleInput.value === 'author' ? 'author' : 'admin';
                    if (!name || !email) {
                        errEl.textContent = 'Name and email are required.';
                        return;
                    }

                    const { error } = await supabase.from('admins').insert({ email, name, role });
                    if (error) {
                        errEl.textContent = error.code === '23505'
                            ? 'That email already has access.'
                            : error.message;
                        return;
                    }

                    statusEl.textContent = `✓ Added as ${role === 'admin' ? 'admin' : 'author'}. They can sign in once they've created an account with ${email} on the login screen.`;
                    setTimeout(() => { statusEl.textContent = ''; }, 5000);
                    nameInput.value = '';
                    emailInput.value = '';
                    roleInput.value = 'admin';
                    loadAdmins();
                });
            }
        }

        // ─── SITE SETTINGS ──────────────────────────────────
        const DEFAULT_SETTINGS = {
            site_name: 'ECOLENS',
            logo_url: '',
            footer_text: '',
            marquee_enabled: false,
            marquee_items: [],
            nav_links: [
                { label: 'Markets', href: '#' },
                { label: 'Policy', href: '#' },
                { label: 'Tech', href: '#' },
                { label: 'Culture', href: '#' },
                { label: 'Money', href: '#' },
            ],
        };

        async function initSettingsPanel() {
            const nameInput = document.getElementById('s-sitename');
            const logoPreview = document.getElementById('logo-preview');
            const removeLogoBtn = document.getElementById('remove-logo-btn');
            const logoStatus = document.getElementById('logo-upload-status');
            const navLinksList = document.getElementById('nav-links-list');
            const errEl = document.getElementById('settings-error');
            const statusEl = document.getElementById('settings-status');

            let settings = { ...DEFAULT_SETTINGS };
            let pendingLogoFile = null;

            const { data, error } = await supabase.from('settings').select('value').eq('id', 'site').single();
            if (!error && data && data.value) {
                settings = {
                    site_name: data.value.site_name || DEFAULT_SETTINGS.site_name,
                    logo_url: data.value.logo_url || '',
                    footer_text: data.value.footer_text || '',
                    marquee_enabled: !!data.value.marquee_enabled,
                    marquee_items: Array.isArray(data.value.marquee_items)
                        ? data.value.marquee_items
                        : (data.value.marquee_text
                            ? data.value.marquee_text.split('•').map(s => s.trim()).filter(Boolean).map(t => ({ type: 'custom', label: t, url: '' }))
                            : []),
                    nav_links: Array.isArray(data.value.nav_links) && data.value.nav_links.length
                        ? data.value.nav_links : DEFAULT_SETTINGS.nav_links,
                };
            }

            nameInput.value = settings.site_name;
            document.getElementById('s-footer-text').value = settings.footer_text;
            document.getElementById('s-marquee-enabled').checked = settings.marquee_enabled;
            let marqueeItems = settings.marquee_items.slice();

            // ── marquee items builder ──
            const marqueeListEl = document.getElementById('marquee-items-list');
            const marqueeTypeSelect = document.getElementById('marquee-new-type');
            const marqueePostField = document.getElementById('marquee-post-field');
            const marqueePostSelect = document.getElementById('marquee-new-post');
            const marqueeLabelField = document.getElementById('marquee-custom-label-field');
            const marqueeUrlField = document.getElementById('marquee-custom-url-field');
            const marqueeLabelInput = document.getElementById('marquee-new-label');
            const marqueeUrlInput = document.getElementById('marquee-new-url');
            const marqueeErrEl = document.getElementById('marquee-error');

            async function loadMarqueePostOptions() {
                const { data: posts } = await supabase.from('posts').select('slug, title').order('created_at', { ascending: false }).limit(100);
                marqueePostSelect.innerHTML = (posts || []).map(p =>
                    `<option value="${escapeHtml(p.slug)}" data-title="${escapeHtml(p.title)}">${escapeHtml(p.title)}</option>`
                ).join('') || '<option value="">No posts yet</option>';
            }
            loadMarqueePostOptions();

            function toggleMarqueeTypeFields() {
                const isPost = marqueeTypeSelect.value === 'post';
                marqueePostField.style.display = isPost ? '' : 'none';
                marqueeLabelField.style.display = isPost ? 'none' : '';
                marqueeUrlField.style.display = isPost ? 'none' : '';
            }
            marqueeTypeSelect.addEventListener('change', toggleMarqueeTypeFields);
            toggleMarqueeTypeFields();

            function renderMarqueeItems() {
                marqueeListEl.innerHTML = marqueeItems.map((item, i) => {
                    const icon = item.type === 'post' ? '📰' : (item.url ? '🔗' : '📢');
                    const desc = item.type === 'post' ? `Post: ${escapeHtml(item.label)}` : escapeHtml(item.label);
                    const urlNote = item.url ? ` <span style="color:var(--text-tertiary);">→ ${escapeHtml(item.url)}</span>` : '';
                    return `
                    <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:8px;padding:8px 12px;">
                        <span>${icon}</span>
                        <span style="flex:1;font-size:13px;">${desc}${urlNote}</span>
                        <button type="button" data-remove-marquee="${i}" title="Remove" style="background:none;border:none;color:var(--text-tertiary);cursor:pointer;font-size:15px;">✕</button>
                    </div>`;
                }).join('') || '<div class="upload-status">No ticker items yet — add one below.</div>';

                marqueeListEl.querySelectorAll('[data-remove-marquee]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        marqueeItems.splice(parseInt(btn.dataset.removeMarquee, 10), 1);
                        renderMarqueeItems();
                    });
                });
            }
            renderMarqueeItems();

            document.getElementById('marquee-add-btn').addEventListener('click', () => {
                marqueeErrEl.textContent = '';
                if (marqueeTypeSelect.value === 'post') {
                    const opt = marqueePostSelect.selectedOptions[0];
                    if (!opt || !opt.value) {
                        marqueeErrEl.textContent = 'Pick a post first (or write one, then come back here).';
                        return;
                    }
                    marqueeItems.push({ type: 'post', slug: opt.value, label: opt.dataset.title || opt.value });
                } else {
                    const label = marqueeLabelInput.value.trim();
                    const url = marqueeUrlInput.value.trim();
                    if (!label) {
                        marqueeErrEl.textContent = 'Add some text for the announcement.';
                        return;
                    }
                    marqueeItems.push({ type: 'custom', label, url });
                    marqueeLabelInput.value = '';
                    marqueeUrlInput.value = '';
                }
                renderMarqueeItems();
            });

            function renderLogoPreview() {
                if (pendingLogoFile) {
                    logoPreview.innerHTML = `<img src="${URL.createObjectURL(pendingLogoFile)}" />`;
                    removeLogoBtn.style.display = 'block';
                } else if (settings.logo_url) {
                    logoPreview.innerHTML = `<img src="${settings.logo_url}" />`;
                    removeLogoBtn.style.display = 'block';
                } else {
                    logoPreview.innerHTML = '🅰';
                    removeLogoBtn.style.display = 'none';
                }
            }
            renderLogoPreview();

            document.getElementById('s-logo').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                pendingLogoFile = file;
                logoStatus.textContent = '';
                renderLogoPreview();
            });

            removeLogoBtn.addEventListener('click', () => {
                pendingLogoFile = null;
                settings.logo_url = '';
                document.getElementById('s-logo').value = '';
                renderLogoPreview();
            });

            function renderNavLinks() {
                navLinksList.innerHTML = settings.nav_links.map((link, i) => `
                <div class="nav-link-row" data-index="${i}">
                  <input class="nl-label" placeholder="Label" value="${escapeHtml(link.label || '')}" />
                  <input class="nl-href" placeholder="https://… or #" value="${escapeHtml(link.href || '')}" />
                  <button type="button" data-remove="${i}" title="Remove">✕</button>
                </div>
              `).join('');

                navLinksList.querySelectorAll('.nav-link-row').forEach(row => {
                    const i = parseInt(row.dataset.index, 10);
                    row.querySelector('.nl-label').addEventListener('input', (e) => {
                        settings.nav_links[i].label = e.target.value;
                    });
                    row.querySelector('.nl-href').addEventListener('input', (e) => {
                        settings.nav_links[i].href = e.target.value;
                    });
                });
                navLinksList.querySelectorAll('[data-remove]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        settings.nav_links.splice(parseInt(btn.dataset.remove, 10), 1);
                        renderNavLinks();
                    });
                });
            }
            renderNavLinks();

            document.getElementById('add-nav-link-btn').addEventListener('click', () => {
                settings.nav_links.push({ label: '', href: '#' });
                renderNavLinks();
            });

            // ── categories ──
            const categoriesList = document.getElementById('categories-list');
            const newCategoryInput = document.getElementById('new-category-name');

            async function renderCategories() {
                const { data: cats, error: catErr } = await supabase.from('categories').select('slug, name')
                    .order('sort_order', { ascending: true });
                if (catErr) {
                    categoriesList.innerHTML = `<div class="upload-status">couldn't load categories: ${escapeHtml(catErr.message)}</div>`;
                    return;
                }
                categoriesList.innerHTML = (cats || []).map(c => `
                <div class="category-row" data-slug="${escapeHtml(c.slug)}">
                  <span class="cat-name">${escapeHtml(c.name)}</span>
                  <span class="cat-slug">/${escapeHtml(c.slug)}</span>
                  <button type="button" data-remove-cat="${escapeHtml(c.slug)}" title="Delete">✕</button>
                </div>
              `).join('') || '<div class="upload-status">no categories yet.</div>';

                categoriesList.querySelectorAll('[data-remove-cat]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm(`Delete category "${btn.dataset.removeCat}"? Posts using it will keep the old value.`)) return;
                        await supabase.from('categories').delete().eq('slug', btn.dataset.removeCat);
                        renderCategories();
                        loadCategoryOptions();
                    });
                });
            }
            renderCategories();

            document.getElementById('add-category-btn').addEventListener('click', async () => {
                const name = newCategoryInput.value.trim();
                if (!name) return;
                const slug = slugify(name);
                const { error: addErr } = await supabase.from('categories').insert({ slug, name });
                if (addErr) {
                    alert('Could not add category: ' + addErr.message);
                    return;
                }
                newCategoryInput.value = '';
                renderCategories();
                loadCategoryOptions();
            });

            document.getElementById('settings-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                errEl.textContent = '';
                statusEl.textContent = '';
                const saveBtn = document.getElementById('settings-save-btn');
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Saving…';

                if (pendingLogoFile) {
                    logoStatus.textContent = 'uploading logo…';
                    try {
                        settings.logo_url = await uploadToStorage(pendingLogoFile, 'branding');
                        pendingLogoFile = null;
                        logoStatus.textContent = '';
                    } catch (uploadErr) {
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = 'Save settings';
                        logoStatus.textContent = '';
                        errEl.textContent = 'Logo upload failed: ' + uploadErr.message;
                        return;
                    }
                }

                settings.site_name = nameInput.value.trim() || DEFAULT_SETTINGS.site_name;
                settings.footer_text = document.getElementById('s-footer-text').value.trim();
                settings.marquee_enabled = document.getElementById('s-marquee-enabled').checked;
                settings.marquee_items = marqueeItems;
                delete settings.marquee_text;
                settings.nav_links = settings.nav_links.filter(l => (l.label || '').trim());

                const { error: saveError } = await supabase.from('settings')
                    .upsert({ id: 'site', value: settings });

                saveBtn.disabled = false;
                saveBtn.innerHTML = 'Save settings';

                if (saveError) {
                    errEl.textContent = saveError.message;
                    return;
                }

                renderLogoPreview();
                renderNavLinks();
                statusEl.textContent = '✓ Saved. Changes will show on the live site.';
                setTimeout(() => { statusEl.textContent = ''; }, 4000);
            });
        }

        // ─── FORMS ──────────────────────────────────────────
        const FIELD_TYPES = [
            { value: 'text', label: 'Short text' },
            { value: 'email', label: 'Email' },
            { value: 'textarea', label: 'Long text' },
            { value: 'number', label: 'Number' },
            { value: 'select', label: 'Dropdown' },
            { value: 'radio', label: 'Radio buttons' },
            { value: 'checkbox', label: 'Checkbox' },
        ];
        let formFields = [];
        let formSlugManuallyEdited = false;

        function fieldTypeNeedsOptions(type) {
            return type === 'select' || type === 'radio';
        }

        function renderFormFields() {
            const listEl = document.getElementById('fm-fields-list');
            if (!listEl) return;
            listEl.innerHTML = formFields.map((f, i) => `
              <div class="builder-item" data-index="${i}">
                <div class="builder-item-head">
                  <span class="idx">#${i + 1}</span>
                  <input type="text" class="fld-label" placeholder="Field label (e.g. Your email)" value="${escapeHtml(f.label || '')}" />
                  <select class="fld-type">
                    ${FIELD_TYPES.map(t => `<option value="${t.value}" ${f.type === t.value ? 'selected' : ''}>${t.label}</option>`).join('')}
                  </select>
                  <button type="button" class="remove-item-btn" data-remove-field="${i}" title="Remove">✕</button>
                </div>
                <div class="builder-item-body">
                  ${fieldTypeNeedsOptions(f.type) ? `<input type="text" class="fld-options" placeholder="Options, comma separated (e.g. Yes, No, Maybe)" value="${escapeHtml((f.options || []).join(', '))}" />` : ''}
                  <label class="field-required">
                    <input type="checkbox" class="fld-required" ${f.required ? 'checked' : ''} /> Required
                  </label>
                </div>
              </div>
            `).join('') || '<div class="upload-status">No fields yet — add one below.</div>';

            listEl.querySelectorAll('.builder-item').forEach(row => {
                const i = parseInt(row.dataset.index, 10);
                row.querySelector('.fld-label').addEventListener('input', (e) => { formFields[i].label = e.target.value; });
                row.querySelector('.fld-type').addEventListener('change', (e) => {
                    formFields[i].type = e.target.value;
                    renderFormFields();
                });
                const optsInput = row.querySelector('.fld-options');
                if (optsInput) {
                    optsInput.addEventListener('input', (e) => {
                        formFields[i].options = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
                    });
                }
                row.querySelector('.fld-required').addEventListener('change', (e) => { formFields[i].required = e.target.checked; });
            });

            listEl.querySelectorAll('[data-remove-field]').forEach(btn => {
                btn.addEventListener('click', () => {
                    formFields.splice(parseInt(btn.dataset.removeField, 10), 1);
                    renderFormFields();
                });
            });
        }

        function resetFormBuilder() {
            formFields = [];
            formSlugManuallyEdited = false;
            document.getElementById('fm-edit-id').value = '';
            document.getElementById('fm-title').value = '';
            document.getElementById('fm-slug').value = '';
            document.getElementById('fm-description').value = '';
            document.getElementById('form-editor-heading').innerHTML = 'New form';
            document.getElementById('form-builder-cancel-btn').style.display = 'none';
            document.getElementById('form-builder-error').textContent = '';
            document.getElementById('form-builder-status').textContent = '';
            renderFormFields();
        }

        function initFormsPanel() {
            const titleInput = document.getElementById('fm-title');
            const slugInput = document.getElementById('fm-slug');
            if (!titleInput) return;

            titleInput.addEventListener('input', () => {
                if (!formSlugManuallyEdited) slugInput.value = slugify(titleInput.value);
            });
            slugInput.addEventListener('input', () => { formSlugManuallyEdited = true; });

            document.getElementById('fm-add-field-btn').addEventListener('click', () => {
                formFields.push({ label: '', type: 'text', required: false, options: [] });
                renderFormFields();
            });

            document.getElementById('form-builder-cancel-btn').addEventListener('click', resetFormBuilder);

            document.getElementById('form-builder-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errEl = document.getElementById('form-builder-error');
                const statusEl = document.getElementById('form-builder-status');
                errEl.textContent = '';
                statusEl.textContent = '';

                const title = titleInput.value.trim();
                if (!title) { errEl.textContent = 'Give the form a title.'; return; }
                const cleanFields = formFields
                    .map(f => ({ ...f, label: (f.label || '').trim() }))
                    .filter(f => f.label);
                if (cleanFields.length === 0) { errEl.textContent = 'Add at least one field.'; return; }

                const slug = slugify(slugInput.value.trim() || title);
                const editId = document.getElementById('fm-edit-id').value;
                const payload = {
                    title,
                    slug,
                    description: document.getElementById('fm-description').value.trim(),
                    fields: cleanFields,
                };

                const saveBtn = document.getElementById('form-builder-save-btn');
                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving…';

                const result = editId
                    ? await supabase.from('forms').update(payload).eq('id', editId).select()
                    : await supabase.from('forms').insert(payload).select();

                saveBtn.disabled = false;
                saveBtn.textContent = 'Save form';

                if (result.error) { errEl.textContent = result.error.message; return; }

                statusEl.textContent = '✓ Saved.';
                setTimeout(() => { statusEl.textContent = ''; }, 3000);
                resetFormBuilder();
                loadFormsList();
            });

            renderFormFields();
        }

        async function loadFormsList() {
            const listEl = document.getElementById('forms-list');
            if (!listEl) return;
            const { data, error } = await supabase.from('forms')
                .select('id, title, slug, fields, created_at')
                .order('created_at', { ascending: false });

            if (error) {
                listEl.innerHTML = `<div class="empty-state">couldn't load forms: ${escapeHtml(error.message)}</div>`;
                return;
            }
            if (!data || data.length === 0) {
                listEl.innerHTML = `<div class="empty-state"><span class="big">🧾</span>No forms yet. Build your first one above.</div>`;
                return;
            }

            const counts = {};
            for (const f of data) {
                const { count } = await supabase.from('form_submissions').select('id', { count: 'exact', head: true }).eq('form_id', f.id);
                counts[f.id] = count || 0;
            }

            listEl.innerHTML = `
            <div class="wp-table-wrap">
              <table class="wp-table">
                <thead>
                  <tr><th>Title</th><th>Fields</th><th>Submissions</th><th>Embed</th><th>Link</th><th>Date</th></tr>
                </thead>
                <tbody>
                  ${data.map(f => `
                    <tr data-id="${f.id}">
                      <td>
                        <div class="post-title-cell">${escapeHtml(f.title)}</div>
                        <div class="row-actions">
                          <button data-action="edit-form" data-id="${f.id}">Edit</button>
                          <span class="sep">|</span>
                          <button class="danger" data-action="delete-form" data-id="${f.id}" data-title="${escapeHtml(f.title)}">Delete</button>
                        </div>
                      </td>
                      <td class="date-cell">${(f.fields || []).length}</td>
                      <td>
                        <span class="cat-pill" style="cursor:pointer;" data-action="view-submissions" data-id="${f.id}" data-title="${escapeHtml(f.title)}">${counts[f.id]} view →</span>
                      </td>
                      <td><span class="embed-code" data-copy="[form:${escapeHtml(f.slug)}]" title="Click to copy">[form:${escapeHtml(f.slug)}]</span></td>
                      <td><a href="../../form.html?slug=${encodeURIComponent(f.slug)}" target="_blank" rel="noopener" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);">Open link ↗</a></td>
                      <td class="date-cell">${new Date(f.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;

            listEl.querySelectorAll('[data-action="edit-form"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const form = data.find(f => f.id === btn.dataset.id);
                    if (!form) return;
                    document.getElementById('fm-edit-id').value = form.id;
                    document.getElementById('fm-title').value = form.title || '';
                    document.getElementById('fm-slug').value = form.slug || '';
                    document.getElementById('fm-description').value = form.description || '';
                    formFields = JSON.parse(JSON.stringify(form.fields || []));
                    formSlugManuallyEdited = true;
                    renderFormFields();
                    document.getElementById('form-editor-heading').innerHTML =
                        'Editing <span class="pill editing">' + escapeHtml(form.slug) + '</span>';
                    document.getElementById('form-builder-cancel-btn').style.display = 'inline-block';
                    document.getElementById('form-editor-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });

            listEl.querySelectorAll('[data-action="delete-form"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm(`Delete "${btn.dataset.title}"? Its submissions will be deleted too.`)) return;
                    await supabase.from('form_submissions').delete().eq('form_id', btn.dataset.id);
                    const { error } = await supabase.from('forms').delete().eq('id', btn.dataset.id);
                    if (error) { alert('Delete failed: ' + error.message); return; }
                    loadFormsList();
                });
            });

            listEl.querySelectorAll('[data-action="view-submissions"]').forEach(btn => {
                btn.addEventListener('click', () => showSubmissionsModal(btn.dataset.id, btn.dataset.title));
            });

            listEl.querySelectorAll('.embed-code').forEach(el => {
                el.addEventListener('click', () => {
                    navigator.clipboard.writeText(el.dataset.copy).then(() => {
                        const orig = el.textContent;
                        el.textContent = 'copied!';
                        setTimeout(() => { el.textContent = orig; }, 1200);
                    });
                });
            });
        }

        async function showSubmissionsModal(formId, formTitle) {
            const backdrop = document.createElement('div');
            backdrop.className = 'submissions-modal-backdrop';
            backdrop.innerHTML = `
            <div class="submissions-modal">
              <div class="panel-header">
                <h2>Submissions — ${escapeHtml(formTitle)}</h2>
                <button type="button" class="btn-ghost btn-small" id="close-submissions-modal">Close</button>
              </div>
              <div id="submissions-modal-body"><div class="loading-state"><span class="spinner"></span> loading…</div></div>
            </div>
          `;
            document.body.appendChild(backdrop);
            backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
            document.getElementById('close-submissions-modal').addEventListener('click', () => backdrop.remove());

            const { data, error } = await supabase.from('form_submissions')
                .select('id, data, created_at')
                .eq('form_id', formId)
                .order('created_at', { ascending: false });

            const bodyEl = document.getElementById('submissions-modal-body');
            if (error) {
                bodyEl.innerHTML = `<div class="empty-state">couldn't load submissions: ${escapeHtml(error.message)}</div>`;
                return;
            }
            if (!data || data.length === 0) {
                bodyEl.innerHTML = `<div class="empty-state"><span class="big">📭</span>No submissions yet.</div>`;
                return;
            }

            const columns = [...new Set(data.flatMap(s => Object.keys(s.data || {})))];
            bodyEl.innerHTML = `
            <div class="wp-table-wrap">
              <table class="wp-table">
                <thead><tr>${columns.map(c => `<th>${escapeHtml(c)}</th>`).join('')}<th>Date</th></tr></thead>
                <tbody>
                  ${data.map(s => `
                    <tr>
                      ${columns.map(c => `<td>${escapeHtml(String((s.data || {})[c] ?? '—'))}</td>`).join('')}
                      <td class="date-cell">${new Date(s.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        }

        // ─── QUIZZES ────────────────────────────────────────
        let quizQuestions = [];
        let quizSlugManuallyEdited = false;

        function renderQuizQuestions() {
            const listEl = document.getElementById('qz-questions-list');
            if (!listEl) return;
            listEl.innerHTML = quizQuestions.map((q, qi) => `
              <div class="builder-item" data-qindex="${qi}">
                <div class="builder-item-head">
                  <span class="idx">Q${qi + 1}</span>
                  <input type="text" class="qz-question-text" placeholder="Question text" value="${escapeHtml(q.question || '')}" />
                  <button type="button" class="remove-item-btn" data-remove-question="${qi}" title="Remove question">✕</button>
                </div>
                <div class="builder-item-body">
                  <div class="qz-options-list" data-qindex="${qi}">
                    ${(q.options || []).map((opt, oi) => `
                      <div class="quiz-option-row" data-oindex="${oi}">
                        <input type="radio" name="qz-correct-${qi}" ${q.correct === oi ? 'checked' : ''} title="Mark correct answer" />
                        <input type="text" class="qz-opt-text" placeholder="Option ${oi + 1}" value="${escapeHtml(opt || '')}" />
                        <button type="button" class="remove-opt-btn" data-remove-opt="${oi}" title="Remove option">✕</button>
                      </div>
                    `).join('')}
                  </div>
                  <button type="button" class="add-item-btn add-opt-btn" data-qindex="${qi}" style="width:fit-content;">+ Add option</button>
                  <input type="text" class="qz-explanation" placeholder="Explanation shown after answering (optional)" value="${escapeHtml(q.explanation || '')}" />
                </div>
              </div>
            `).join('') || '<div class="upload-status">No questions yet — add one below.</div>';

            listEl.querySelectorAll('.builder-item').forEach(block => {
                const qi = parseInt(block.dataset.qindex, 10);
                block.querySelector('.qz-question-text').addEventListener('input', (e) => {
                    quizQuestions[qi].question = e.target.value;
                });
                block.querySelector('.qz-explanation').addEventListener('input', (e) => {
                    quizQuestions[qi].explanation = e.target.value;
                });
                block.querySelectorAll('.quiz-option-row').forEach(row => {
                    const oi = parseInt(row.dataset.oindex, 10);
                    row.querySelector('.qz-opt-text').addEventListener('input', (e) => {
                        quizQuestions[qi].options[oi] = e.target.value;
                    });
                    row.querySelector('input[type="radio"]').addEventListener('change', () => {
                        quizQuestions[qi].correct = oi;
                    });
                    row.querySelector('[data-remove-opt]').addEventListener('click', () => {
                        quizQuestions[qi].options.splice(oi, 1);
                        if (quizQuestions[qi].correct === oi) delete quizQuestions[qi].correct;
                        else if (quizQuestions[qi].correct > oi) quizQuestions[qi].correct -= 1;
                        renderQuizQuestions();
                    });
                });
                block.querySelector('.add-opt-btn').addEventListener('click', () => {
                    quizQuestions[qi].options.push('');
                    renderQuizQuestions();
                });
                block.querySelector('[data-remove-question]').addEventListener('click', () => {
                    quizQuestions.splice(qi, 1);
                    renderQuizQuestions();
                });
            });
        }

        function resetQuizBuilder() {
            quizQuestions = [];
            quizSlugManuallyEdited = false;
            document.getElementById('qz-edit-id').value = '';
            document.getElementById('qz-title').value = '';
            document.getElementById('qz-slug').value = '';
            document.getElementById('qz-description').value = '';
            document.getElementById('quiz-editor-heading').innerHTML = 'New quiz';
            document.getElementById('quiz-builder-cancel-btn').style.display = 'none';
            document.getElementById('quiz-builder-error').textContent = '';
            document.getElementById('quiz-builder-status').textContent = '';
            renderQuizQuestions();
        }

        function initQuizPanel() {
            const titleInput = document.getElementById('qz-title');
            const slugInput = document.getElementById('qz-slug');
            if (!titleInput) return;

            titleInput.addEventListener('input', () => {
                if (!quizSlugManuallyEdited) slugInput.value = slugify(titleInput.value);
            });
            slugInput.addEventListener('input', () => { quizSlugManuallyEdited = true; });

            document.getElementById('qz-add-question-btn').addEventListener('click', () => {
                quizQuestions.push({ question: '', options: ['', ''], correct: 0, explanation: '' });
                renderQuizQuestions();
            });

            document.getElementById('quiz-builder-cancel-btn').addEventListener('click', resetQuizBuilder);

            document.getElementById('quiz-builder-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errEl = document.getElementById('quiz-builder-error');
                const statusEl = document.getElementById('quiz-builder-status');
                errEl.textContent = '';
                statusEl.textContent = '';

                const title = titleInput.value.trim();
                if (!title) { errEl.textContent = 'Give the quiz a title.'; return; }

                const cleanQuestions = quizQuestions
                    .map(q => ({
                        question: (q.question || '').trim(),
                        options: (q.options || []).map(o => (o || '').trim()).filter(Boolean),
                        correct: q.correct,
                        explanation: (q.explanation || '').trim(),
                    }))
                    .filter(q => q.question && q.options.length >= 2);

                if (cleanQuestions.length === 0) {
                    errEl.textContent = 'Add at least one question with 2+ options.';
                    return;
                }
                for (const q of cleanQuestions) {
                    if (typeof q.correct !== 'number' || q.correct < 0 || q.correct >= q.options.length) {
                        errEl.textContent = `Mark a correct answer for "${q.question}".`;
                        return;
                    }
                }

                const slug = slugify(slugInput.value.trim() || title);
                const editId = document.getElementById('qz-edit-id').value;
                const payload = {
                    title,
                    slug,
                    description: document.getElementById('qz-description').value.trim(),
                    questions: cleanQuestions,
                };

                const saveBtn = document.getElementById('quiz-builder-save-btn');
                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving…';

                const result = editId
                    ? await supabase.from('quizzes').update(payload).eq('id', editId).select()
                    : await supabase.from('quizzes').insert(payload).select();

                saveBtn.disabled = false;
                saveBtn.textContent = 'Save quiz';

                if (result.error) { errEl.textContent = result.error.message; return; }

                statusEl.textContent = '✓ Saved.';
                setTimeout(() => { statusEl.textContent = ''; }, 3000);
                resetQuizBuilder();
                loadQuizzesList();
            });

            renderQuizQuestions();
        }

        async function loadQuizzesList() {
            const listEl = document.getElementById('quizzes-list');
            if (!listEl) return;
            const { data, error } = await supabase.from('quizzes')
                .select('id, title, slug, questions, created_at')
                .order('created_at', { ascending: false });

            if (error) {
                listEl.innerHTML = `<div class="empty-state">couldn't load quizzes: ${escapeHtml(error.message)}</div>`;
                return;
            }
            if (!data || data.length === 0) {
                listEl.innerHTML = `<div class="empty-state"><span class="big">❓</span>No quizzes yet. Build your first one above.</div>`;
                return;
            }

            listEl.innerHTML = `
            <div class="wp-table-wrap">
              <table class="wp-table">
                <thead><tr><th>Title</th><th>Questions</th><th>Embed</th><th>Date</th></tr></thead>
                <tbody>
                  ${data.map(q => `
                    <tr data-id="${q.id}">
                      <td>
                        <div class="post-title-cell">${escapeHtml(q.title)}</div>
                        <div class="row-actions">
                          <button data-action="edit-quiz" data-id="${q.id}">Edit</button>
                          <span class="sep">|</span>
                          <button class="danger" data-action="delete-quiz" data-id="${q.id}" data-title="${escapeHtml(q.title)}">Delete</button>
                        </div>
                      </td>
                      <td class="date-cell">${(q.questions || []).length}</td>
                      <td><span class="embed-code" data-copy="[quiz:${escapeHtml(q.slug)}]" title="Click to copy">[quiz:${escapeHtml(q.slug)}]</span></td>
                      <td class="date-cell">${new Date(q.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;

            listEl.querySelectorAll('[data-action="edit-quiz"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const quiz = data.find(q => q.id === btn.dataset.id);
                    if (!quiz) return;
                    document.getElementById('qz-edit-id').value = quiz.id;
                    document.getElementById('qz-title').value = quiz.title || '';
                    document.getElementById('qz-slug').value = quiz.slug || '';
                    document.getElementById('qz-description').value = quiz.description || '';
                    quizQuestions = JSON.parse(JSON.stringify(quiz.questions || []));
                    quizSlugManuallyEdited = true;
                    renderQuizQuestions();
                    document.getElementById('quiz-editor-heading').innerHTML =
                        'Editing <span class="pill editing">' + escapeHtml(quiz.slug) + '</span>';
                    document.getElementById('quiz-builder-cancel-btn').style.display = 'inline-block';
                    document.getElementById('quiz-editor-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });

            listEl.querySelectorAll('[data-action="delete-quiz"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm(`Delete "${btn.dataset.title}"?`)) return;
                    const { error } = await supabase.from('quizzes').delete().eq('id', btn.dataset.id);
                    if (error) { alert('Delete failed: ' + error.message); return; }
                    loadQuizzesList();
                });
            });

            listEl.querySelectorAll('.embed-code').forEach(el => {
                el.addEventListener('click', () => {
                    navigator.clipboard.writeText(el.dataset.copy).then(() => {
                        const orig = el.textContent;
                        el.textContent = 'copied!';
                        setTimeout(() => { el.textContent = orig; }, 1200);
                    });
                });
            });
        }

        // ─── BOOT ──────────────────────────────────────────
        renderDashboard();

        supabase.auth.onAuthStateChange((event) => {
            if (event === 'SIGNED_OUT') window.location.href = LOGIN_URL;
        });
    </script>
</body>
</html>
