<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sign in · ECOLENS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('ecolens-admin-theme');
                var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0e;
            --bg-secondary: #111118;
            --bg-card: #16161f;
            --bg-card-hover: #1c1c28;
            --border: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.12);
            --text: #f0ede8;
            --text-secondary: rgba(240, 237, 232, 0.65);
            --text-tertiary: rgba(240, 237, 232, 0.35);
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.25);
            --lime: #c9ff3d;
            --lime-glow: rgba(201, 255, 61, 0.15);
            --coral: #ff6b4a;
            --coral-glow: rgba(255, 107, 74, 0.15);
            --cyan: #5bd8ff;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        :root[data-theme="light"] {
            --bg: #f7f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f5;
            --border: #e4e4ec;
            --border-strong: #cfcfdb;
            --text: #14141a;
            --text-secondary: #4a4a58;
            --text-tertiary: #84848f;
            --accent: #6c3ce0;
            --accent-glow: rgba(108, 60, 224, 0.1);
            --lime: #5c8a00;
            --lime-glow: rgba(92, 138, 0, 0.1);
            --coral: #d6492c;
            --coral-glow: rgba(214, 73, 44, 0.1);
            --cyan: #0077be;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        body,
        .panel,
        .topbar,
        .login-card,
        .post-item {
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ::selection {
            background: var(--accent);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ── utilities ── */
        .wrap {
            max-width: 920px;
            margin: 0 auto;
            padding: 32px 24px 80px;
        }

        /* ── topbar ── */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 36px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.02em;
        }
        .brand .dot {
            color: var(--lime);
        }

        .brand-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            background: var(--accent);
            color: #fff;
            padding: 3px 12px;
            border-radius: 999px;
            opacity: 0.85;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color var(--transition);
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
        }
        .back-link:hover {
            color: var(--text);
            border-color: var(--border);
            background: rgba(255, 255, 255, 0.05);
        }
        .back-link svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        /* ── login ── */
        .login-container {
            max-width: 400px;
            margin: 60px auto 0;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 44px 36px 36px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--lime), var(--accent));
            opacity: 0.6;
        }

        .login-card .icon-wrap {
            width: 52px;
            height: 52px;
            background: rgba(124, 92, 255, 0.12);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 26px;
        }

        .login-card h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .login-card .sub {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .login-card form label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .login-card form input {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            padding: 13px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 18px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .login-card form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .login-card form input::placeholder {
            color: var(--text-tertiary);
        }

        .error-msg {
            color: var(--coral);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            min-height: 18px;
            margin: -4px 0 14px;
        }
        .status-msg {
            color: var(--lime);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            min-height: 18px;
            margin: -4px 0 14px;
        }

        /* ── buttons ── */
        button {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            padding: 12px 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active {
            transform: scale(0.97);
        }
        button:focus-visible {
            outline: 2px solid var(--lime);
            outline-offset: 2px;
        }

        .oauth-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0;
            color: var(--text-tertiary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .oauth-divider::before,
        .oauth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .btn-github {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            background: var(--bg-card);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition);
        }
        .btn-github:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }
        .btn-github:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-github svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn-primary {
            background: var(--lime);
            color: #0a0a0e;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 20px var(--lime-glow);
        }
        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 28px var(--lime-glow);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border-color: var(--border-strong);
        }

        /* ── anims ── */
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-state {
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .loading-state .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 999px;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 640px) {
            .wrap {
                padding: 20px 16px 60px;
            }
            .topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .brand-group {
                justify-content: space-between;
            }
            .topbar-actions {
                justify-content: flex-start;
            }
            .login-card {
                padding: 32px 20px 28px;
            }
        }
    </style>
</head>
<body>

    <div class="wrap">
        <header class="topbar">
            <div class="brand-group">
                <div class="brand">ECOLENS<span class="dot">.</span></div>
                <span class="brand-badge">admin</span>
            </div>
            <div class="topbar-actions">
                <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle dark / light theme">🌙</button>
                <a class="back-link" href="../index.html">
                    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
                    view site
                </a>
            </div>
        </header>

        <div id="app"><div class="loading-state"><span class="spinner"></span> checking session…</div></div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://ojlmwlqrkbctlpexrufs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2aMsITRDeO8MfFHiWIkNzQ_JENBP08R';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const app = document.getElementById('app');
        const DASH_URL = 'dash/';

        // ─── THEME ──────────────────────────────────────────
        const ADMIN_THEME_KEY = 'ecolens-admin-theme';

        function getThemeIcon() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀️';
        }
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(ADMIN_THEME_KEY, theme);
            document.querySelectorAll('.theme-toggle').forEach(btn => { btn.textContent = getThemeIcon(); });
        }
        document.addEventListener('click', (e) => {
            if (e.target.closest('.theme-toggle')) {
                const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                applyTheme(next);
            }
        });
        applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

        // ─── ADMIN CHECK ────────────────────────────────────
        async function isCurrentUserAdmin(email) {
            if (!email) return false;
            const { data, error } = await supabase.from('admins').select('email, role').eq('email', email).maybeSingle();
            return !error && !!data;
        }

        // ─── LOGIN ──────────────────────────────────────────
        function renderLogin(message) {
            app.innerHTML = `
            <div class="login-container fade-in">
              <div class="login-card">
                <div class="icon-wrap">🌱</div>
                <h1>Welcome back</h1>
                <p class="sub">Sign in to publish and manage your stories.</p>

                <button type="button" class="btn-github" id="github-login-btn">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
                    <span id="github-btn-label">Continue with GitHub</span>
                </button>

                <div class="oauth-divider">or</div>

                <form id="login-form">
                  <label for="email">Email</label>
                  <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />

                  <label for="password">Password</label>
                  <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />

                  <div class="error-msg" id="login-error">${escapeHtml(message || '')}</div>

                  <button type="submit" class="btn-primary" id="login-btn">
                    <span>Sign in</span>
                  </button>
                </form>
                <p style="margin-top:16px;font-size:12.5px;color:var(--text-tertiary);">No account yet? <a href="#" id="show-signup" style="color:var(--accent);text-decoration:underline;">Request access</a></p>
                <form id="signup-form" style="display:none;margin-top:12px;">
                  <label for="su-name">Your name</label>
                  <input id="su-name" placeholder="Jane Doe" required />
                  <label for="su-email">Email</label>
                  <input id="su-email" type="email" placeholder="you@example.com" required />
                  <label for="su-password">Password</label>
                  <input id="su-password" type="password" placeholder="••••••••" required />
                  <div class="error-msg" id="signup-error"></div>
                  <div class="status-msg" id="signup-status"></div>
                  <button type="submit" class="btn-ghost" id="signup-btn" style="width:100%;">Create account</button>
                  <p style="margin-top:10px;font-size:11.5px;color:var(--text-tertiary);">Creating an account doesn't grant admin access by itself — an existing admin still needs to approve you on the Admins screen.</p>
                </form>
              </div>
            </div>
          `;

            document.getElementById('show-signup').addEventListener('click', (e) => {
                e.preventDefault();
                document.getElementById('signup-form').style.display = 'block';
            });

            const githubBtn = document.getElementById('github-login-btn');
            const githubBtnLabel = document.getElementById('github-btn-label');
            githubBtn.addEventListener('click', async () => {
                const errEl = document.getElementById('login-error');
                errEl.textContent = '';
                githubBtn.disabled = true;
                githubBtnLabel.textContent = 'Redirecting to GitHub…';

                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'github',
                    options: { redirectTo: window.location.origin + window.location.pathname.replace(/index\.html$/, '') + DASH_URL }
                });

                if (error) {
                    errEl.textContent = error.message;
                    githubBtn.disabled = false;
                    githubBtnLabel.textContent = 'Continue with GitHub';
                }
                // on success, the browser navigates away to GitHub, so no further action needed here
            });

            const form = document.getElementById('login-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('login-btn');
                const errEl = document.getElementById('login-error');
                errEl.textContent = '';
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> signing in…';

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                const { error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    errEl.textContent = error.message;
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign in</span>';
                    return;
                }

                const admin = await isCurrentUserAdmin(email);
                if (!admin) {
                    await supabase.auth.signOut();
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign in</span>';
                    errEl.textContent = "Your account exists but hasn't been approved as an admin yet. Ask an existing admin to add your email on the Admins screen.";
                    return;
                }

                window.location.href = DASH_URL;
            });

            document.getElementById('signup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('signup-btn');
                const errEl = document.getElementById('signup-error');
                const statusEl = document.getElementById('signup-status');
                errEl.textContent = '';
                statusEl.textContent = '';
                btn.disabled = true;
                btn.textContent = 'Creating…';

                const name = document.getElementById('su-name').value.trim();
                const email = document.getElementById('su-email').value.trim();
                const password = document.getElementById('su-password').value;

                const { error } = await supabase.auth.signUp({
                    email, password, options: { data: { name } }
                });

                btn.disabled = false;
                btn.textContent = 'Create account';

                if (error) {
                    errEl.textContent = error.message;
                    return;
                }
                statusEl.textContent = '✓ Account created. Ask an existing admin to approve your email on the Admins screen, then sign in above.';
            });
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#39;' }[m]));
        }

        // ─── BOOT ──────────────────────────────────────────
        const params = new URLSearchParams(window.location.search);
        const msgParam = params.get('msg');
        const boundaryMessage = msgParam === 'not_approved'
            ? "Your account hasn't been approved as an admin yet."
            : '';

        (async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const admin = await isCurrentUserAdmin(session.user.email);
                if (admin) {
                    window.location.href = DASH_URL;
                    return;
                }
                await supabase.auth.signOut();
            }
            renderLogin(boundaryMessage);
        })();
    </script>
</body>
</html>
