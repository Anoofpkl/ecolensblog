<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · ECOLENS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0e;
            --bg-secondary: #111118;
            --bg-card: rgba(22, 22, 31, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            --text: #f0ede8;
            --text-secondary: rgba(240, 237, 232, 0.7);
            --text-tertiary: rgba(240, 237, 232, 0.4);
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.3);
            --lime: #c9ff3d;
            --lime-glow: rgba(201, 255, 61, 0.2);
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 25px 80px rgba(0, 0, 0, 0.7);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        :root[data-theme="light"] {
            --bg: #f0f0f5;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.8);
            --border: rgba(0, 0, 0, 0.06);
            --border-strong: rgba(0, 0, 0, 0.12);
            --text: #14141a;
            --text-secondary: rgba(20, 20, 26, 0.65);
            --text-tertiary: rgba(20, 20, 26, 0.4);
            --accent: #6c3ce0;
            --accent-glow: rgba(108, 60, 224, 0.15);
            --lime: #5c8a00;
            --lime-glow: rgba(92, 138, 0, 0.15);
            --shadow: 0 25px 80px rgba(0, 0, 0, 0.12);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: background var(--transition), color var(--transition);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(124, 92, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(201, 255, 61, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(124, 92, 255, 0.05) 0%, transparent 40%);
        }

        ::selection {
            background: var(--accent);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ── login container ── */
        .login-container {
            width: 100%;
            max-width: 1140px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: 620px;
            transition: background var(--transition), border-color var(--transition);
            position: relative;
        }

        .login-container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(135deg, rgba(124, 92, 255, 0.2), transparent 50%, rgba(201, 255, 61, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ── left: image panel ── */
        .login-image {
            position: relative;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0e;
        }

        .login-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .login-image:hover img {
            transform: scale(1.02);
        }

        .login-image .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    rgba(10, 10, 14, 0.4) 0%,
                    rgba(10, 10, 14, 0.1) 50%,
                    rgba(10, 10, 14, 0.6) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 48px 40px;
        }

        .login-image .overlay .brand-mark {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .login-image .overlay .brand-mark .dot {
            color: var(--lime);
        }

        .login-image .overlay .tagline {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
            max-width: 80%;
        }

        .login-image .overlay .badge-row {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .login-image .overlay .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ── right: form panel ── */
        .login-form-panel {
            padding: 48px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 400px;
        }

        .login-form-panel .form-header {
            margin-bottom: 32px;
        }

        .login-form-panel .form-header .greeting {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .login-form-panel .form-header .sub {
            color: var(--text-secondary);
            font-size: 14.5px;
            font-weight: 400;
        }

        .login-form-panel .form-header .sub a {
            color: var(--accent);
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 2px;
            transition: color var(--transition);
        }
        .login-form-panel .form-header .sub a:hover {
            color: var(--lime);
        }

        /* ── form elements ── */
        .login-form-panel form label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .login-form-panel form input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            padding: 14px 17px;
            border-radius: var(--radius-sm);
            margin-bottom: 18px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
        }

        .login-form-panel form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: rgba(0, 0, 0, 0.35);
        }

        .login-form-panel form input::placeholder {
            color: var(--text-tertiary);
        }

        .error-msg {
            color: #ff6b4a;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            min-height: 18px;
            margin: -6px 0 12px;
        }
        .status-msg {
            color: var(--lime);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            min-height: 18px;
            margin: -6px 0 12px;
        }

        /* ── buttons ── */
        .btn-primary {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 15px;
            padding: 14px 24px;
            background: var(--lime);
            color: #0a0a0e;
            width: 100%;
            box-shadow: 0 4px 24px var(--lime-glow);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
        }
        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 8px 40px var(--lime-glow);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-github {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-github:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .btn-github:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-github svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .oauth-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 18px 0;
            color: var(--text-tertiary);
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }
        .oauth-divider::before,
        .oauth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .toggle-form-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .toggle-form-link a {
            color: var(--accent);
            font-weight: 500;
            cursor: pointer;
            transition: color var(--transition);
        }
        .toggle-form-link a:hover {
            color: var(--lime);
        }

        #signup-form {
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: none;
        }

        #signup-form .btn-ghost {
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            padding: 12px 22px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            transition: all var(--transition);
        }
        #signup-form .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text);
            border-color: var(--accent);
        }
        #signup-form .btn-ghost:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(10, 10, 14, 0.15);
            border-top-color: #0a0a0e;
            border-radius: 999px;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .login-form-panel .theme-toggle-wrap {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 5;
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            flex-shrink: 0;
            transition: all var(--transition);
            backdrop-filter: blur(8px);
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        /* ── responsive ── */
        @media (max-width: 820px) {
            .login-container {
                grid-template-columns: 1fr;
                min-height: auto;
            }
            .login-image {
                min-height: 260px;
                order: -1;
            }
            .login-image .overlay {
                padding: 28px 28px;
            }
            .login-image .overlay .brand-mark {
                font-size: 22px;
            }
            .login-image .overlay .tagline {
                max-width: 100%;
                font-size: 13px;
            }
            .login-form-panel {
                padding: 32px 26px;
                min-height: auto;
            }
            .login-form-panel .form-header .greeting {
                font-size: 24px;
            }
            .login-form-panel .theme-toggle-wrap {
                top: 14px;
                right: 16px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .login-container {
                border-radius: 16px;
            }
            .login-image {
                min-height: 200px;
            }
            .login-image .overlay {
                padding: 20px 20px;
            }
            .login-image .overlay .badge-row .badge {
                font-size: 8px;
                padding: 3px 10px;
            }
            .login-form-panel {
                padding: 24px 18px;
            }
            .login-form-panel .form-header .greeting {
                font-size: 20px;
            }
            .login-form-panel form input {
                font-size: 14px;
                padding: 12px 14px;
            }
            .btn-primary {
                font-size: 14px;
                padding: 12px 20px;
            }
        }

        /* ── fade-in animation ── */
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── loading state ── */
        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 40px 20px;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }
        .loading-state .spinner {
            border-color: var(--border);
            border-top-color: var(--accent);
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container fade-in" id="login-container">
        <!-- LEFT: Image panel -->
        <div class="login-image">
            <img
            src="https://ecolensblog.vercel.app/Gemini_Generated_Image_gebp3jgebp3jgebp.png"
            alt="ECOLENS visual"
            loading="lazy"
            />
            <div class="overlay">
                <div class="brand-mark">ECOLENS<span class="dot">.</span></div>
                <div class="tagline">Economy, markets, policy, tech &amp; culture — clearly explained.</div>
                <div class="badge-row">
                    <span class="badge">✦ Curated</span>
                    <span class="badge">📈 Data-driven</span>
                    <span class="badge">🌍 Global</span>
                </div>
            </div>
        </div>

        <!-- RIGHT: Form panel -->
        <div class="login-form-panel" style="position:relative;">
            <div class="theme-toggle-wrap">
                <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle theme">🌙</button>
            </div>

            <div id="app">
                <div class="loading-state"><span class="spinner"></span> loading…</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://ojlmwlqrkbctlpexrufs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2aMsITRDeO8MfFHiWIkNzQ_JENBP08R';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const app = document.getElementById('app');

        // ─── THEME ──────────────────────────────────────────
        const ADMIN_THEME_KEY = 'ecolens-admin-theme';

        function getThemeIcon() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀️';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(ADMIN_THEME_KEY, theme);
            document.querySelectorAll('.theme-toggle').forEach(btn => { btn.textContent = getThemeIcon(); });
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('.theme-toggle')) {
                const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                applyTheme(next);
            }
        });

        // init theme
        const savedTheme = localStorage.getItem(ADMIN_THEME_KEY);
        if (savedTheme === 'light' || savedTheme === 'dark') {
            applyTheme(savedTheme);
        } else {
            applyTheme('dark');
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#39;' }[m]));
        }

        // ─── ADMIN CHECK ────────────────────────────────────
        let currentUserRole = null;

        async function isCurrentUserAdmin(email) {
            if (!email) return false;
            const { data, error } = await supabase.from('admins').select('email, role').eq('email', email).maybeSingle();
            if (error || !data) { currentUserRole = null; return false; }
            currentUserRole = data.role || 'admin';
            return true;
        }

        // ─── RENDER LOGIN ───────────────────────────────────
        function renderLogin(message) {
            app.innerHTML = `
            <div class="fade-in">
              <div class="form-header">
                <div class="greeting">Welcome back</div>
                <div class="sub">Sign in to publish and manage your stories.</div>
              </div>

              <button type="button" class="btn-github" id="github-login-btn">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
                <span>Continue with GitHub</span>
              </button>

              <div class="oauth-divider">or</div>

              <form id="login-form">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />

                <div class="error-msg" id="login-error">${escapeHtml(message || '')}</div>

                <button type="submit" class="btn-primary" id="login-btn">
                  <span>Sign in</span>
                </button>
              </form>

              <div class="toggle-form-link">
                No account yet? <a id="show-signup">Request access</a>
              </div>

              <form id="signup-form">
                <label for="su-name">Your name</label>
                <input id="su-name" placeholder="Jane Doe" required />
                <label for="su-email">Email</label>
                <input id="su-email" type="email" placeholder="you@example.com" required />
                <label for="su-password">Password</label>
                <input id="su-password" type="password" placeholder="••••••••" required />
                <div class="error-msg" id="signup-error"></div>
                <div class="status-msg" id="signup-status"></div>
                <button type="submit" class="btn-ghost" id="signup-btn">Create account</button>
                <div style="margin-top:10px;font-size:11.5px;color:var(--text-tertiary);line-height:1.5;">
                  Creating an account doesn't grant admin access by itself — an existing admin still needs to approve you on the Admins screen.
                </div>
              </form>
            </div>
          `;

            document.getElementById('show-signup').addEventListener('click', (e) => {
                e.preventDefault();
                const form = document.getElementById('signup-form');
                form.style.display = form.style.display === 'block' ? 'none' : 'block';
            });

            // ── login form ──
            const form = document.getElementById('login-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('login-btn');
                const errEl = document.getElementById('login-error');
                errEl.textContent = '';
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> signing in…';

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                const { error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    errEl.textContent = error.message;
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign in</span>';
                    return;
                }

                const admin = await isCurrentUserAdmin(email);
                if (!admin) {
                    await supabase.auth.signOut();
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign in</span>';
                    errEl.textContent = "Your account exists but hasn't been approved as an admin yet. Ask an existing admin to add your email on the Admins screen.";
                    return;
                }

                // success → redirect to dashboard
                window.location.href = 'dashboard.html';
            });

            // ── signup form ──
            document.getElementById('signup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('signup-btn');
                const errEl = document.getElementById('signup-error');
                const statusEl = document.getElementById('signup-status');
                errEl.textContent = '';
                statusEl.textContent = '';
                btn.disabled = true;
                btn.textContent = 'Creating…';

                const name = document.getElementById('su-name').value.trim();
                const email = document.getElementById('su-email').value.trim();
                const password = document.getElementById('su-password').value;

                const { error } = await supabase.auth.signUp({
                    email, password, options: { data: { name } }
                });

                btn.disabled = false;
                btn.textContent = 'Create account';

                if (error) {
                    errEl.textContent = error.message;
                    return;
                }
                statusEl.textContent = '✓ Account created. Ask an existing admin to approve your email on the Admins screen, then sign in above.';
                document.getElementById('signup-form').querySelectorAll('input').forEach(i => i.value = '');
                setTimeout(() => { document.getElementById('signup-form').style.display = 'none'; }, 4000);
            });

            // ── GitHub OAuth ──
            document.getElementById('github-login-btn').addEventListener('click', async () => {
                const btn = document.getElementById('github-login-btn');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> redirecting…';

                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'github',
                    options: { redirectTo: window.location.origin + '/dashboard.html' }
                });

                if (error) {
                    btn.disabled = false;
                    btn.innerHTML = '<span>Continue with GitHub</span>';
                    document.getElementById('login-error').textContent = error.message;
                }
            });
        }

        // ─── BOOT ──────────────────────────────────────────
        (async function init() {
            const { data: { session } } = await supabase.auth.getSession();

            if (session) {
                // Check if this user is an admin
                const admin = await isCurrentUserAdmin(session.user.email);
                if (admin) {
                    window.location.href = 'dashboard.html';
                    return;
                } else {
                    await supabase.auth.signOut();
                    renderLogin("Your account hasn't been approved as an admin yet.");
                    return;
                }
            }

            renderLogin();
        })();

        supabase.auth.onAuthStateChange((event) => {
            if (event === 'SIGNED_OUT') {
                renderLogin();
            }
            if (event === 'SIGNED_IN') {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
