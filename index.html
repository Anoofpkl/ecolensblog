<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · ECOLENS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-start: #0a0a12;
            --bg-end: #14141f;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.07);
            --card-shadow: rgba(0, 0, 0, 0.6);
            --text: #f0ede8;
            --text-secondary: rgba(240, 237, 232, 0.6);
            --text-tertiary: rgba(240, 237, 232, 0.35);
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.25);
            --accent-light: #a58aff;
            --lime: #c9ff3d;
            --lime-glow: rgba(201, 255, 61, 0.15);
            --radius: 24px;
            --radius-sm: 12px;
            --shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        :root[data-theme="light"] {
            --bg-start: #eef0f5;
            --bg-end: #d5d8e3;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(0, 0, 0, 0.06);
            --card-shadow: rgba(0, 0, 0, 0.08);
            --text: #14141a;
            --text-secondary: rgba(20, 20, 26, 0.6);
            --text-tertiary: rgba(20, 20, 26, 0.35);
            --accent: #6c3ce0;
            --accent-glow: rgba(108, 60, 224, 0.12);
            --accent-light: #8b6af0;
            --lime: #5c8a00;
            --lime-glow: rgba(92, 138, 0, 0.12);
            --shadow: 0 30px 80px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg-start);
            transition: background var(--transition);
            position: relative;
            overflow: hidden;
        }

        /* ── animated gradient background ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(124, 92, 255, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(201, 255, 61, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(124, 92, 255, 0.08) 0%, transparent 40%),
                linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            animation: bgShift 20s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% {
                background:
                    radial-gradient(ellipse at 20% 50%, rgba(124, 92, 255, 0.15) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(201, 255, 61, 0.08) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 100%, rgba(124, 92, 255, 0.08) 0%, transparent 40%),
                    linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            }
            50% {
                background:
                    radial-gradient(ellipse at 60% 30%, rgba(124, 92, 255, 0.18) 0%, transparent 55%),
                    radial-gradient(ellipse at 20% 70%, rgba(201, 255, 61, 0.10) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 80%, rgba(124, 92, 255, 0.06) 0%, transparent 45%),
                    linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            }
            100% {
                background:
                    radial-gradient(ellipse at 70% 60%, rgba(124, 92, 255, 0.12) 0%, transparent 50%),
                    radial-gradient(ellipse at 30% 30%, rgba(201, 255, 61, 0.12) 0%, transparent 55%),
                    radial-gradient(ellipse at 10% 90%, rgba(124, 92, 255, 0.10) 0%, transparent 45%),
                    linear-gradient(125deg, var(--bg-start) 0%, var(--bg-end) 100%);
            }
        }

        /* floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--lime);
            bottom: -60px;
            left: -60px;
            animation-delay: -6s;
            opacity: 0.15;
        }
        .orb-3 {
            width: 250px;
            height: 250px;
            background: #5bd8ff;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -12s;
            opacity: 0.06;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.9);
            }
            100% {
                transform: translate(20px, -20px) scale(1.05);
            }
        }

        ::selection {
            background: var(--accent);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 999px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ── login card ── */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border-radius: var(--radius);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            padding: 48px 40px 40px;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(135deg, rgba(124, 92, 255, 0.2), transparent 40%, rgba(201, 255, 61, 0.08));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ── brand ── */
        .brand-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 14px;
            box-shadow: 0 8px 32px var(--accent-glow);
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-title .dot {
            color: var(--lime);
        }

        .brand-sub {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
            margin-top: 4px;
            letter-spacing: 0.01em;
        }

        /* ── theme toggle ── */
        .theme-toggle-wrap {
            position: absolute;
            top: 16px;
            right: 18px;
        }

        .theme-toggle {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: all var(--transition);
            backdrop-filter: blur(8px);
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
            color: var(--text);
        }

        /* ── form ── */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            padding: 13px 16px;
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: rgba(0, 0, 0, 0.3);
        }

        .form-group input::placeholder {
            color: var(--text-tertiary);
        }

        .form-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4) inset !important;
            -webkit-text-fill-color: var(--text) !important;
        }

        .error-msg {
            color: #ff6b4a;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            min-height: 18px;
            margin: -4px 0 12px;
        }

        .status-msg {
            color: var(--lime);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            min-height: 18px;
            margin: -4px 0 12px;
        }

        /* ── buttons ── */
        .btn-primary {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 15px;
            padding: 14px 24px;
            background: var(--lime);
            color: #0a0a0e;
            width: 100%;
            box-shadow: 0 4px 24px var(--lime-glow);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
        }

        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 8px 40px var(--lime-glow);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-ghost {
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            padding: 12px 22px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            transition: all var(--transition);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            border-color: var(--accent);
        }

        .btn-ghost:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-github {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-github:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .btn-github:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-github svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 20px 0 18px;
            color: var(--text-tertiary);
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--card-border);
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .toggle-link a {
            color: var(--accent);
            font-weight: 500;
            cursor: pointer;
            transition: color var(--transition);
        }

        .toggle-link a:hover {
            color: var(--lime);
        }

        #signup-form {
            margin-top: 12px;
            padding-top: 18px;
            border-top: 1px solid var(--card-border);
            display: none;
        }

        #signup-form .btn-ghost {
            margin-top: 4px;
        }

        #signup-form .footnote {
            margin-top: 10px;
            font-size: 11.5px;
            color: var(--text-tertiary);
            line-height: 1.5;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(10, 10, 14, 0.15);
            border-top-color: #0a0a0e;
            border-radius: 999px;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }

        .spinner-light {
            border-color: rgba(255, 255, 255, 0.15);
            border-top-color: #fff;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 0;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .loading-state .spinner {
            border-color: var(--card-border);
            border-top-color: var(--accent);
            width: 20px;
            height: 20px;
        }

        /* ── responsive ── */
        @media (max-width: 520px) {
            body {
                padding: 16px;
            }
            .login-card {
                padding: 32px 22px 28px;
                border-radius: 20px;
            }
            .brand-title {
                font-size: 22px;
            }
            .brand-icon {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
            .theme-toggle-wrap {
                top: 12px;
                right: 14px;
            }
            .form-group input {
                font-size: 14px;
                padding: 11px 14px;
            }
            .btn-primary {
                font-size: 14px;
                padding: 12px 20px;
            }
        }

        @media (max-width: 400px) {
            .login-card {
                padding: 24px 16px 20px;
            }
            .brand-section {
                margin-bottom: 24px;
            }
            .brand-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- floating orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-card fade-in" id="login-card">
        <div class="theme-toggle-wrap">
            <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle theme">🌙</button>
        </div>

        <div class="brand-section">
            <div class="brand-icon">E</div>
            <div class="brand-title">ECOLENS<span class="dot">.</span></div>
            <div class="brand-sub">Economy · Markets · Policy · Tech · Culture</div>
        </div>

        <div id="app">
            <div class="loading-state"><span class="spinner"></span> loading…</div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://ojlmwlqrkbctlpexrufs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2aMsITRDeO8MfFHiWIkNzQ_JENBP08R';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const app = document.getElementById('app');

        // ─── THEME ──────────────────────────────────────────
        const THEME_KEY = 'ecolens-admin-theme';

        function getThemeIcon() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀️';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            document.querySelectorAll('.theme-toggle').forEach(btn => { btn.textContent = getThemeIcon(); });
        }

        document.addEventListener('click', (e) => {
            if (e.target.closest('.theme-toggle')) {
                const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                applyTheme(next);
            }
        });

        const saved = localStorage.getItem(THEME_KEY);
        applyTheme(saved === 'light' || saved === 'dark' ? saved : 'dark');

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#39;' }[m]));
        }

        // ─── ADMIN CHECK ────────────────────────────────────
        let currentUserRole = null;

        async function isCurrentUserAdmin(email) {
            if (!email) return false;
            const { data, error } = await supabase.from('admins').select('email, role').eq('email', email).maybeSingle();
            if (error || !data) { currentUserRole = null; return false; }
            currentUserRole = data.role || 'admin';
            return true;
        }

        // ─── RENDER LOGIN ───────────────────────────────────
        function renderLogin(message) {
            app.innerHTML = `
            <div class="fade-in">
              <button type="button" class="btn-github" id="github-login-btn">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
                <span>Continue with GitHub</span>
              </button>

              <div class="divider">or</div>

              <form id="login-form">
                <div class="form-group">
                  <label for="email">Email</label>
                  <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
                </div>

                <div class="error-msg" id="login-error">${escapeHtml(message || '')}</div>

                <button type="submit" class="btn-primary" id="login-btn">
                  <span>Sign in</span>
                </button>
              </form>

              <div class="toggle-link">
                No account yet? <a id="show-signup">Request access</a>
              </div>

              <form id="signup-form">
                <div class="form-group">
                  <label for="su-name">Your name</label>
                  <input id="su-name" placeholder="Jane Doe" required />
                </div>
                <div class="form-group">
                  <label for="su-email">Email</label>
                  <input id="su-email" type="email" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                  <label for="su-password">Password</label>
                  <input id="su-password" type="password" placeholder="••••••••" required />
                </div>
                <div class="error-msg" id="signup-error"></div>
                <div class="status-msg" id="signup-status"></div>
                <button type="submit" class="btn-ghost" id="signup-btn">Create account</button>
                <div class="footnote">
                  Creating an account doesn't grant admin access by itself — an existing admin still needs to approve you on the Admins screen.
                </div>
              </form>
            </div>
          `;

            // ── toggle signup ──
            document.getElementById('show-signup').addEventListener('click', (e) => {
                e.preventDefault();
                const form = document.getElementById('signup-form');
                form.style.display = form.style.display === 'block' ? 'none' : 'block';
            });

            // ── login ──
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('login-btn');
                const errEl = document.getElementById('login-error');
                errEl.textContent = '';
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> signing in…';

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                const { error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    errEl.textContent = error.message;
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign in</span>';
                    return;
                }

                const admin = await isCurrentUserAdmin(email);
                if (!admin) {
                    await supabase.auth.signOut();
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign in</span>';
                    errEl.textContent = "Your account exists but hasn't been approved as an admin yet. Ask an existing admin to add your email on the Admins screen.";
                    return;
                }

                window.location.href = 'dashboard.html';
            });

            // ── signup ──
            document.getElementById('signup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('signup-btn');
                const errEl = document.getElementById('signup-error');
                const statusEl = document.getElementById('signup-status');
                errEl.textContent = '';
                statusEl.textContent = '';
                btn.disabled = true;
                btn.textContent = 'Creating…';

                const name = document.getElementById('su-name').value.trim();
                const email = document.getElementById('su-email').value.trim();
                const password = document.getElementById('su-password').value;

                const { error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: { data: { name } }
                });

                btn.disabled = false;
                btn.textContent = 'Create account';

                if (error) {
                    errEl.textContent = error.message;
                    return;
                }
                statusEl.textContent = '✓ Account created. Ask an existing admin to approve your email on the Admins screen, then sign in above.';
                document.getElementById('signup-form').querySelectorAll('input').forEach(i => i.value = '');
                setTimeout(() => { document.getElementById('signup-form').style.display = 'none'; }, 4000);
            });

            // ── GitHub ──
            document.getElementById('github-login-btn').addEventListener('click', async () => {
                const btn = document.getElementById('github-login-btn');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner spinner-light"></span> redirecting…';

                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'github',
                    options: { redirectTo: window.location.origin + '/dashboard.html' }
                });

                if (error) {
                    btn.disabled = false;
                    btn.innerHTML = '<span>Continue with GitHub</span>';
                    document.getElementById('login-error').textContent = error.message;
                }
            });
        }

        // ─── BOOT ──────────────────────────────────────────
        (async function init() {
            const { data: { session } } = await supabase.auth.getSession();

            if (session) {
                const admin = await isCurrentUserAdmin(session.user.email);
                if (admin) {
                    window.location.href = 'dashboard.html';
                    return;
                } else {
                    await supabase.auth.signOut();
                    renderLogin("Your account hasn't been approved as an admin yet.");
                    return;
                }
            }

            renderLogin();
        })();

        supabase.auth.onAuthStateChange((event) => {
            if (event === 'SIGNED_OUT') renderLogin();
            if (event === 'SIGNED_IN') window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
