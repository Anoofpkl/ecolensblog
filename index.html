<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>admin · ECOLENS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('ecolens-admin-theme');
                var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0e;
            --bg-secondary: #111118;
            --bg-card: #16161f;
            --bg-card-hover: #1c1c28;
            --border: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.12);
            --text: #f0ede8;
            --text-secondary: rgba(240, 237, 232, 0.65);
            --text-tertiary: rgba(240, 237, 232, 0.35);
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.25);
            --lime: #c9ff3d;
            --lime-glow: rgba(201, 255, 61, 0.15);
            --coral: #ff6b4a;
            --coral-glow: rgba(255, 107, 74, 0.15);
            --cyan: #5bd8ff;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        :root[data-theme="light"] {
            --bg: #f7f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f5;
            --border: #e4e4ec;
            --border-strong: #cfcfdb;
            --text: #14141a;
            --text-secondary: #4a4a58;
            --text-tertiary: #84848f;
            --accent: #6c3ce0;
            --accent-glow: rgba(108, 60, 224, 0.1);
            --lime: #5c8a00;
            --lime-glow: rgba(92, 138, 0, 0.1);
            --coral: #d6492c;
            --coral-glow: rgba(214, 73, 44, 0.1);
            --cyan: #0077be;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        body,
        .panel,
        .topbar,
        .login-card,
        .post-item {
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ::selection {
            background: var(--accent);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ── utilities ── */
        .wrap {
            max-width: 920px;
            margin: 0 auto;
            padding: 32px 24px 80px;
        }

        /* ── topbar ── */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 36px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.02em;
        }
        .brand .dot {
            color: var(--lime);
        }

        .brand-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            background: var(--accent);
            color: #fff;
            padding: 3px 12px;
            border-radius: 999px;
            opacity: 0.85;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color var(--transition);
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
        }
        .back-link:hover {
            color: var(--text);
            border-color: var(--border);
            background: rgba(255, 255, 255, 0.05);
        }
        .back-link svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        /* ── login ── */
        .login-container {
            max-width: 400px;
            margin: 60px auto 0;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 44px 36px 36px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--lime), var(--accent));
            opacity: 0.6;
        }

        .login-card .icon-wrap {
            width: 52px;
            height: 52px;
            background: rgba(124, 92, 255, 0.12);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 26px;
        }

        .login-card h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .login-card .sub {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .login-card form label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .login-card form input {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            padding: 13px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 18px;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        .login-card form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .login-card form input::placeholder {
            color: var(--text-tertiary);
        }

        .error-msg {
            color: var(--coral);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            min-height: 18px;
            margin: -4px 0 14px;
        }
        .status-msg {
            color: var(--lime);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            min-height: 18px;
            margin: -4px 0 14px;
        }

        /* ── buttons ── */
        button {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            padding: 12px 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active {
            transform: scale(0.97);
        }
        button:focus-visible {
            outline: 2px solid var(--lime);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--lime);
            color: #0a0a0e;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 20px var(--lime-glow);
        }
        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 28px var(--lime-glow);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border-color: var(--border-strong);
        }

        .btn-danger {
            background: rgba(255, 107, 74, 0.08);
            color: var(--coral);
            border: 1px solid rgba(255, 107, 74, 0.2);
        }
        .btn-danger:hover {
            background: rgba(255, 107, 74, 0.16);
            border-color: var(--coral);
            box-shadow: 0 0 20px var(--coral-glow);
        }

        .btn-small {
            font-size: 12px;
            padding: 7px 14px;
            border-radius: 8px;
        }

        .btn-outline-accent {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .btn-outline-accent:hover {
            background: rgba(124, 92, 255, 0.1);
        }

        .btn-icon {
            padding: 8px 10px;
            font-size: 16px;
            line-height: 1;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            border-radius: 8px;
        }
        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border-color: var(--border);
        }

        /* ── dashboard ── */
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .dash-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .dash-header h1 span {
            color: var(--lime);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 6px 8px 6px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
        }
        .user-badge .avatar {
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
        }

        /* ── panel ── */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: var(--shadow);
            transition: border-color var(--transition);
        }
        .panel:hover {
            border-color: var(--border-strong);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .panel-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-header .pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: var(--accent);
            color: #fff;
            padding: 3px 12px;
            border-radius: 999px;
            opacity: 0.85;
        }
        .panel-header .pill.draft {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }
        .panel-header .pill.editing {
            background: var(--lime);
            color: #0a0a0e;
        }

        /* ── form ── */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-secondary);
        }

        .field input,
        .field textarea,
        .field select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            width: 100%;
        }
        .field input:focus,
        .field textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .field input::placeholder,
        .field textarea::placeholder {
            color: var(--text-tertiary);
        }
        .field textarea {
            min-height: 180px;
            resize: vertical;
            line-height: 1.6;
            font-size: 14px;
        }
        .field input[type="number"] {
            max-width: 140px;
        }

        .slug-preview {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--lime);
            padding: 4px 0 2px;
            word-break: break-all;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .form-actions .btn-primary {
            width: auto;
            min-width: 140px;
        }
        .form-actions .btn-ghost {
            width: auto;
        }

        /* ── post list ── */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .post-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            background: transparent;
            transition: background var(--transition);
            border: 1px solid transparent;
        }
        .post-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--border);
        }

        .post-item .info {
            min-width: 0;
            flex: 1;
        }
        .post-item .info .title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .post-item .info .title .emoji {
            font-size: 18px;
        }
        .post-item .info .meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .post-item .info .meta .tag {
            background: rgba(255, 255, 255, 0.06);
            padding: 1px 10px;
            border-radius: 999px;
            color: var(--text-secondary);
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .post-item .info .meta .views {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .post-item .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .empty-state {
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 28px 0 12px;
            text-align: center;
        }
        .empty-state .big {
            font-size: 38px;
            display: block;
            margin-bottom: 12px;
        }

        .loading-state {
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .loading-state .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 999px;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── responsive tweaks ── */
        @media (max-width: 640px) {
            .wrap {
                padding: 20px 16px 60px;
            }
            .topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .brand-group {
                justify-content: space-between;
            }
            .topbar-actions {
                justify-content: flex-start;
            }
            .dash-header {
                flex-direction: column;
                align-items: stretch;
            }
            .user-badge {
                align-self: flex-start;
            }
            .panel {
                padding: 20px 16px;
            }
            .login-card {
                padding: 32px 20px 28px;
            }
            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .form-actions .btn-primary {
                min-width: unset;
            }
            .post-item {
                flex-wrap: wrap;
                padding: 14px 12px;
            }
            .post-item .actions {
                width: 100%;
                justify-content: flex-end;
            }
        }

        .body-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        /* ── image upload ── */
        .image-upload {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .image-preview {
            width: 84px;
            height: 84px;
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            border: 1px dashed var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            font-size: 26px;
            color: var(--text-tertiary);
        }
        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .image-upload-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .file-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            transition: all var(--transition);
            width: fit-content;
        }
        .file-btn:hover {
            color: var(--text);
            border-color: var(--accent);
            background: rgba(124, 92, 255, 0.08);
        }
        .file-btn input[type="file"] {
            display: none;
        }
        .remove-image-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--coral);
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            padding: 0;
            width: fit-content;
            opacity: 0.85;
        }
        .remove-image-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }
        .upload-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .category-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .category-row .cat-name {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--text);
        }
        .category-row .cat-slug {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-tertiary);
            flex: 1;
        }
        .category-row button {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            background: rgba(255, 107, 74, 0.08);
            color: var(--coral);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .category-row button:hover {
            background: rgba(255, 107, 74, 0.16);
        }

        /* ── site settings panel ── */
        .nav-link-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .nav-link-row input {
            background: var(--bg-secondary);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 9px 12px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }
        .nav-link-row input.nl-label {
            flex: 1;
            min-width: 0;
        }

<body>

    <div class="wrap">

                    view site

        <div id="app"><div class="loading-state"><span class="spinner"></span> checking session…</div></div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://ojlmwlqrkbctlpexrufs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2aMsITRDeO8MfFHiWIkNzQ_JENBP08R';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const app = document.getElementById('app');

        // ─── THEME ──────────────────────────────────────────
        const ADMIN_THEME_KEY = 'ecolens-admin-theme';

        function getThemeIcon() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀️';
        }
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(ADMIN_THEME_KEY, theme);
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.textContent = getThemeIcon();
        }
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            applyTheme(next);
        });
        applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#39;' }[m]));
        }

        function slugify(str) {
            return String(str || '')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
        }

        function getInitials(email) {
            if (!email) return '?';
            const parts = email.split('@')[0].split(/[._-]/);
            return parts.map(p => p[0]).join('').slice(0, 2).toUpperCase() || '?';
        }

        // ─── STORAGE UPLOAD ─────────────────────────────────
        const STORAGE_BUCKET = 'post-images';

        async function uploadToStorage(file, folder) {
            const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
            const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
            const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, file, {
                cacheControl: '3600',
                upsert: false,
            });
            if (error) throw error;
            const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
            return data.publicUrl;
        }

        async function loadCategoryOptions(selectedSlug) {
            const tagSelect = document.getElementById('f-tag');
            if (!tagSelect) return;
            const { data: cats } = await supabase.from('categories').select('slug, name').order('sort_order',
                { ascending: true });
            const list = (cats && cats.length) ? cats : [{ slug: 'econ', name: 'Econ' }];
            tagSelect.innerHTML = list.map(c =>
                `<option value="${escapeHtml(c.slug)}">${escapeHtml(c.name)}</option>`
            ).join('');
            if (selectedSlug) tagSelect.value = selectedSlug;
        }

        // ─── LOGIN ──────────────────────────────────────────
        function renderLogin() {
            app.innerHTML = `
            <div class="login-container fade-in">
              <div class="login-card">
                <div class="icon-wrap">🌱</div>
                <h1>Welcome back</h1>
                <p class="sub">Sign in to publish and manage your stories.</p>
                <form id="login-form">
                  <label for="email">Email</label>
                  <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />

                  <label for="password">Password</label>
                  <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />

                  <div class="error-msg" id="login-error"></div>

                  <button type="submit" class="btn-primary" id="login-btn">
                    <span>Sign in</span>
                  </button>
                </form>
              </div>
            </div>
          `;

            const form = document.getElementById('login-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('login-btn');
                const errEl = document.getElementById('login-error');
                errEl.textContent = '';
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> signing in…';

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                const { error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    errEl.textContent = error.message;
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign in</span>';
                    return;
                }
                await renderDashboard();
            });
        }

        // ─── DASHBOARD ──────────────────────────────────────
        async function renderDashboard() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { renderLogin(); return; }

            const initials = getInitials(session.user.email);

            app.innerHTML = `
            <div class="fade-in">
              <div class="dash-header">
                <h1>Write <span>·</span> manage</h1>
                <div class="user-badge">
                  ${escapeHtml(session.user.email)}
                  <span class="avatar">${escapeHtml(initials)}</span>
                  <button class="btn-icon btn-small" id="logout-btn" title="Sign out" style="font-size:14px;">✕</button>
                </div>
              </div>

              <!-- editor panel -->
              <div class="panel" id="editor-panel">
                <div class="panel-header">
                  <h2 id="editor-heading">
                    New post
                    <span class="pill draft">draft</span>
                  </h2>
                </div>

                <form id="post-form">
                  <input type="hidden" id="edit-id" value="" />

                  <div class="form-grid">
                    <div class="field full">
                      <label for="f-title">Title</label>
                      <input id="f-title" placeholder="Write a headline that pulls people in" required />
                    </div>

                    <div class="field full">
                      <label for="f-slug">Slug <span style="font-weight:400;text-transform:none;color:var(--text-tertiary);">(URL)</span></label>
                      <input id="f-slug" placeholder="auto-generated from title" />
                      <div class="slug-preview" id="slug-preview">index.html?post=…</div>
                    </div>

                    <div class="field">
                      <label for="f-tag">Category</label>
                      <select id="f-tag"></select>
                    </div>

                    <div class="field">
                      <label for="f-emoji">Emoji <span style="font-weight:400;text-transform:none;color:var(--text-tertiary);">(fallback if no image)</span></label>
                      <input id="f-emoji" placeholder="📰" maxlength="4" />
                    </div>

                    <div class="field full">
                      <label>Cover image</label>
                      <div class="image-upload">
                        <div class="image-preview" id="image-preview">🖼</div>
                        <div class="image-upload-actions">
                          <label class="file-btn">
                            📤 <span id="upload-btn-label">Upload image</span>
                            <input type="file" id="f-image" accept="image/*" />
                          </label>
                          <button type="button" class="remove-image-btn" id="remove-image-btn" style="display:none;">Remove image</button>
                          <span class="upload-status" id="upload-status"></span>
                        </div>
                      </div>
                    </div>

                    <div class="field full">
                      <label for="f-excerpt">One-line take <span style="font-weight:400;text-transform:none;color:var(--text-tertiary);">(shows on feed)</span></label>
                      <input id="f-excerpt" placeholder="The tl;dr that makes someone click" maxlength="160" />
                    </div>

                    <div class="field">
                      <label for="f-readtime">Read time <span style="font-weight:400;text-transform:none;color:var(--text-tertiary);">(min)</span></label>
                      <input id="f-readtime" type="number" min="1" max="60" value="5" />
                    </div>

                    <div class="field full">
                      <label for="f-content">Body <span style="font-weight:400;text-transform:none;color:var(--text-tertiary);">(separate paragraphs with a blank line)</span></label>
                      <div class="body-toolbar">
                        <label class="file-btn">
                          🖼 <span id="inline-image-btn-label">Insert image into post</span>
                          <input type="file" id="f-inline-image" accept="image/*" />
                        </label>
                        <span class="upload-status" id="inline-image-status"></span>
                      </div>
                      <textarea id="f-content" placeholder="Write like you're explaining it to a smart friend. Separate paragraphs with a blank line."></textarea>
                    </div>
                  </div>

                  <div class="error-msg" id="form-error"></div>
                  <div class="status-msg" id="form-status"></div>

                  <div class="form-actions">
                    <button type="submit" class="btn-primary" id="save-btn">Publish</button>
                    <button type="button" class="btn-ghost" id="cancel-edit-btn" style="display:none;">Cancel edit</button>
                  </div>
                </form>
              </div>

              <!-- site settings -->
              <div class="panel" id="settings-panel">
                <div class="panel-header">
                  <h2>Site settings</h2>
                </div>
                <form id="settings-form">
                  <div class="form-grid">
                    <div class="field full">
                      <label for="s-sitename">Site name</label>
                      <input id="s-sitename" placeholder="ECOLENS" />
                    </div>

                    <div class="field full">
                      <label>Logo</label>
                      <div class="image-upload">
                        <div class="image-preview" id="logo-preview">🅰</div>
                        <div class="image-upload-actions">
                          <label class="file-btn">
                            📤 <span id="logo-upload-btn-label">Upload logo</span>
                            <input type="file" id="s-logo" accept="image/*" />
                          </label>
                          <button type="button" class="remove-image-btn" id="remove-logo-btn" style="display:none;">Remove logo</button>
                          <span class="upload-status" id="logo-upload-status"></span>
                        </div>
                      </div>
                    </div>

                    <div class="field full">
                      <label>Categories <span style="font-weight:400;text-transform:none;color:var(--text-tertiary);">(slug-based — used for post tagging &amp; ?category= filtering)</span></label>
                      <div id="categories-list"></div>
                      <div style="display:flex;gap:8px;margin-top:6px;">
                        <input id="new-category-name" placeholder="New category name" style="flex:1;background:var(--bg-secondary);border:1px solid var(--border-strong);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;" />
                        <button type="button" class="add-nav-link-btn" id="add-category-btn">+ Add</button>
                      </div>
                    </div>

                    <div class="field full">
                      <label>Nav links <span style="font-weight:400;text-transform:none;color:var(--text-tertiary);">(shown in the header)</span></label>
                      <div id="nav-links-list"></div>
                      <button type="button" class="add-nav-link-btn" id="add-nav-link-btn">+ Add link</button>
                    </div>
                  </div>

                  <div class="error-msg" id="settings-error"></div>
                  <div class="status-msg" id="settings-status"></div>

                  <div class="form-actions">
                    <button type="submit" class="btn-primary" id="settings-save-btn">Save settings</button>
                  </div>
                </form>
              </div>

              <!-- posts list -->
              <div class="panel">
                <div class="panel-header">
                  <h2>Published posts</h2>
                  <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-tertiary);" id="post-count"></span>
                </div>
                <div id="post-list"><div class="loading-state"><span class="spinner"></span> loading…</div></div>
              </div>
            </div>
          `;

            // ── logout ──
            document.getElementById('logout-btn').addEventListener('click', async () => {
                await supabase.auth.signOut();
                renderLogin();
            });

            // ── slug logic ──
            const slugInput = document.getElementById('f-slug');
            const titleInput = document.getElementById('f-title');
            const slugPreview = document.getElementById('slug-preview');
            let slugManuallyEdited = false;

            function updateSlugPreview() {
                const val = slugInput.value || slugify(titleInput.value) || '…';
                slugPreview.textContent = 'index.html?post=' + val;
            }

            titleInput.addEventListener('input', () => {
                if (!slugManuallyEdited) slugInput.value = slugify(titleInput.value);
                updateSlugPreview();
            });
            slugInput.addEventListener('input', () => {
                slugManuallyEdited = true;
                slugInput.value = slugify(slugInput.value);
                updateSlugPreview();
            });
            updateSlugPreview();

            // ── cover image upload ──
            let currentImageUrl = '';
            let pendingImageFile = null;
            const imagePreview = document.getElementById('image-preview');
            const removeImageBtn = document.getElementById('remove-image-btn');
            const uploadStatus = document.getElementById('upload-status');

            function renderImagePreview() {
                if (pendingImageFile) {
                    imagePreview.innerHTML = `<img src="${URL.createObjectURL(pendingImageFile)}" />`;
                    removeImageBtn.style.display = 'block';
                } else if (currentImageUrl) {
                    imagePreview.innerHTML = `<img src="${currentImageUrl}" />`;
                    removeImageBtn.style.display = 'block';
                } else {
                    imagePreview.innerHTML = '🖼';
                    removeImageBtn.style.display = 'none';
                }
            }

            document.getElementById('f-image').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                pendingImageFile = file;
                uploadStatus.textContent = '';
                renderImagePreview();
            });

            removeImageBtn.addEventListener('click', () => {
                pendingImageFile = null;
                currentImageUrl = '';
                document.getElementById('f-image').value = '';
                uploadStatus.textContent = '';
                renderImagePreview();
            });

            // ── category select ──
            loadCategoryOptions();

            // ── insert image into post body ──
            const contentArea = document.getElementById('f-content');
            const inlineImageStatus = document.getElementById('inline-image-status');

            document.getElementById('f-inline-image').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                inlineImageStatus.textContent = 'uploading…';
                try {
                    const url = await uploadToStorage(file, 'inline');
                    const cursorPos = contentArea.selectionStart ?? contentArea.value.length;
                    const before = contentArea.value.slice(0, cursorPos);
                    const after = contentArea.value.slice(cursorPos);
                    const needsLeadingBreak = before && !before.endsWith('\n\n') ? (before.endsWith('\n') ? '\n' :
                        '\n\n') : '';
                    const insertText = `${needsLeadingBreak}[image:${url}]\n\n`;
                    contentArea.value = before + insertText + after;
                    const newPos = (before + insertText).length;
                    contentArea.focus();
                    contentArea.setSelectionRange(newPos, newPos);
                    inlineImageStatus.textContent = '✓ inserted';
                    setTimeout(() => { inlineImageStatus.textContent = ''; }, 2500);
                } catch (err) {
                    inlineImageStatus.textContent = 'upload failed: ' + err.message;
                }
                e.target.value = '';
            });

            // ── cancel edit ──
            document.getElementById('cancel-edit-btn').addEventListener('click', () => resetForm());

            // ── submit ──
            document.getElementById('post-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errEl = document.getElementById('form-error');
                const statusEl = document.getElementById('form-status');
                const saveBtn = document.getElementById('save-btn');
                errEl.textContent = '';
                statusEl.textContent = '';

                const editId = document.getElementById('edit-id').value;
                const title = titleInput.value.trim();
                const slug = slugify(slugInput.value || titleInput.value);

                if (!title || !slug) {
                    errEl.textContent = 'Title and slug are required.';
                    return;
                }

                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> ' + (editId ?
                    'Saving…' : 'Publishing…');

                // upload cover image if a new file was chosen
                if (pendingImageFile) {
                    uploadStatus.textContent = 'uploading image…';
                    try {
                        currentImageUrl = await uploadToStorage(pendingImageFile, 'posts');
                        pendingImageFile = null;
                        uploadStatus.textContent = '';
                    } catch (uploadErr) {
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = 'Publish';
                        uploadStatus.textContent = '';
                        errEl.textContent = 'Image upload failed: ' + uploadErr.message;
                        return;
                    }
                }

                const payload = {
                    title,
                    slug,
                    tag: document.getElementById('f-tag').value.trim() || 'econ',
                    image_emoji: document.getElementById('f-emoji').value.trim() || '📰',
                    image_url: currentImageUrl || null,
                    excerpt: document.getElementById('f-excerpt').value.trim(),
                    read_time: parseInt(document.getElementById('f-readtime').value, 10) || 5,
                    content: document.getElementById('f-content').value.trim(),
                };

                let result;
                if (editId) {
                    result = await supabase.from('posts').update(payload).eq('id', editId).select();
                } else {
                    result = await supabase.from('posts').insert(payload).select();
                }

                saveBtn.disabled = false;
                saveBtn.innerHTML = 'Publish';

                if (result.error) {
                    if (result.error.code === '23505') {
                        errEl.textContent = 'That slug is already taken — pick a different one.';
                    } else {
                        errEl.textContent = result.error.message;
                    }
                    return;
                }

                statusEl.textContent = editId ? '✓ Saved.' : '✓ Published.';
                setTimeout(() => { statusEl.textContent = ''; }, 4000);
                resetForm();
                loadPostList();
            });

            // ── reset form ──
            function resetForm() {
                document.getElementById('post-form').reset();
                document.getElementById('edit-id').value = '';
                document.getElementById('f-readtime').value = 5;
                document.getElementById('editor-heading').innerHTML = 'New post <span class="pill draft">draft</span>';
                document.getElementById('cancel-edit-btn').style.display = 'none';
                slugManuallyEdited = false;
                updateSlugPreview();
                document.getElementById('form-error').textContent = '';
                document.getElementById('form-status').textContent = '';
                currentImageUrl = '';
                pendingImageFile = null;
                uploadStatus.textContent = '';
                renderImagePreview();
                loadCategoryOptions();
            }

            // ── load posts ──
            async function loadPostList() {
                const listEl = document.getElementById('post-list');
                const countEl = document.getElementById('post-count');

                const { data, error } = await supabase
                    .from('posts')
                    .select('id, title, slug, tag, views, created_at, image_emoji')
                    .order('created_at', { ascending: false });

                if (error) {
                    listEl.innerHTML =
                        `<div class="empty-state">couldn't load posts: ${escapeHtml(error.message)}</div>`;
                    return;
                }
                if (!data || data.length === 0) {
                    listEl.innerHTML =
                        `<div class="empty-state"><span class="big">📭</span>No posts yet. Write your first one above.</div>`;
                    countEl.textContent = '';
                    return;
                }

                countEl.textContent = data.length + ' post' + (data.length > 1 ? 's' : '');

                listEl.innerHTML = data.map(p => `
                <div class="post-item" data-id="${p.id}">
                  <div class="info">
                    <div class="title">
                      <span class="emoji">${escapeHtml(p.image_emoji || '📄')}</span>
                      ${escapeHtml(p.title)}
                    </div>
                    <div class="meta">
                      <span>/${escapeHtml(p.slug)}</span>
                      <span class="tag">${escapeHtml(p.tag || 'econ')}</span>
                      <span class="views">👁 ${p.views || 0}</span>
                    </div>
                  </div>
                  <div class="actions">
                    <button class="btn-ghost btn-small" data-action="edit" data-id="${p.id}">Edit</button>
                    <button class="btn-danger btn-small" data-action="delete" data-id="${p.id}" data-title="${escapeHtml(p.title)}">Delete</button>
                  </div>
                </div>
              `).join('');

                // edit
                listEl.querySelectorAll('[data-action="edit"]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const { data: post, error } = await supabase.from('posts').select('*').eq('id',
                            btn.dataset.id).single();
                        if (error || !post) return;
                        document.getElementById('edit-id').value = post.id;
                        document.getElementById('f-title').value = post.title || '';
                        document.getElementById('f-slug').value = post.slug || '';
                        loadCategoryOptions(post.tag || '');
                        document.getElementById('f-emoji').value = post.image_emoji || '';
                        document.getElementById('f-excerpt').value = post.excerpt || '';
                        document.getElementById('f-readtime').value = post.read_time || 5;
                        document.getElementById('f-content').value = post.content || '';
                        currentImageUrl = post.image_url || '';
                        pendingImageFile = null;
                        document.getElementById('f-image').value = '';
                        renderImagePreview();
                        slugManuallyEdited = true;
                        updateSlugPreview();
                        document.getElementById('editor-heading').innerHTML =
                            'Editing <span class="pill editing">' + escapeHtml(post.slug) + '</span>';
                        document.getElementById('cancel-edit-btn').style.display = 'inline-block';
                        document.getElementById('editor-panel').scrollIntoView({ behavior: 'smooth',
                        block: 'start' });
                    });
                });

                // delete
                listEl.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm(`Delete "${btn.dataset.title}"? This can't be undone.`)) return;
                        const { error } = await supabase.from('posts').delete().eq('id', btn.dataset.id);
                        if (error) { alert('Delete failed: ' + error.message); return; }
                        loadPostList();
                    });
                });
            }

            loadPostList();
            initSettingsPanel();
        }

        // ─── SITE SETTINGS ──────────────────────────────────
        const DEFAULT_SETTINGS = {
            site_name: 'ECOLENS',
            logo_url: '',
            nav_links: [
                { label: 'Markets', href: '#' },
                { label: 'Policy', href: '#' },
                { label: 'Tech', href: '#' },
                { label: 'Culture', href: '#' },
                { label: 'Money', href: '#' },
            ],
        };

        async function initSettingsPanel() {
            const nameInput = document.getElementById('s-sitename');
            const logoPreview = document.getElementById('logo-preview');
            const removeLogoBtn = document.getElementById('remove-logo-btn');
            const logoStatus = document.getElementById('logo-upload-status');
            const navLinksList = document.getElementById('nav-links-list');
            const errEl = document.getElementById('settings-error');
            const statusEl = document.getElementById('settings-status');

            let settings = { ...DEFAULT_SETTINGS };
            let pendingLogoFile = null;

            const { data, error } = await supabase.from('settings').select('value').eq('id', 'site').single();
            if (!error && data && data.value) {
                settings = {
                    site_name: data.value.site_name || DEFAULT_SETTINGS.site_name,
                    logo_url: data.value.logo_url || '',
                    nav_links: Array.isArray(data.value.nav_links) && data.value.nav_links.length
                        ? data.value.nav_links : DEFAULT_SETTINGS.nav_links,
                };
            }

            nameInput.value = settings.site_name;

            function renderLogoPreview() {
                if (pendingLogoFile) {
                    logoPreview.innerHTML = `<img src="${URL.createObjectURL(pendingLogoFile)}" />`;
                    removeLogoBtn.style.display = 'block';
                } else if (settings.logo_url) {
                    logoPreview.innerHTML = `<img src="${settings.logo_url}" />`;
                    removeLogoBtn.style.display = 'block';
                } else {
                    logoPreview.innerHTML = '🅰';
                    removeLogoBtn.style.display = 'none';
                }
            }
            renderLogoPreview();

            document.getElementById('s-logo').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                pendingLogoFile = file;
                logoStatus.textContent = '';
                renderLogoPreview();
            });

            removeLogoBtn.addEventListener('click', () => {
                pendingLogoFile = null;
                settings.logo_url = '';
                document.getElementById('s-logo').value = '';
                renderLogoPreview();
            });

            function renderNavLinks() {
                navLinksList.innerHTML = settings.nav_links.map((link, i) => `
                <div class="nav-link-row" data-index="${i}">
                  <input class="nl-label" placeholder="Label" value="${escapeHtml(link.label || '')}" />
                  <input class="nl-href" placeholder="https://… or #" value="${escapeHtml(link.href || '')}" />
                  <button type="button" data-remove="${i}" title="Remove">✕</button>
                </div>
              `).join('');

                navLinksList.querySelectorAll('.nav-link-row').forEach(row => {
                    const i = parseInt(row.dataset.index, 10);
                    row.querySelector('.nl-label').addEventListener('input', (e) => {
                        settings.nav_links[i].label = e.target.value;
                    });
                    row.querySelector('.nl-href').addEventListener('input', (e) => {
                        settings.nav_links[i].href = e.target.value;
                    });
                });
                navLinksList.querySelectorAll('[data-remove]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        settings.nav_links.splice(parseInt(btn.dataset.remove, 10), 1);
                        renderNavLinks();
                    });
                });
            }
            renderNavLinks();

            document.getElementById('add-nav-link-btn').addEventListener('click', () => {
                settings.nav_links.push({ label: '', href: '#' });
                renderNavLinks();
            });

            // ── categories ──
            const categoriesList = document.getElementById('categories-list');
            const newCategoryInput = document.getElementById('new-category-name');

            async function renderCategories() {
                const { data: cats, error: catErr } = await supabase.from('categories').select('slug, name')
                    .order('sort_order', { ascending: true });
                if (catErr) {
                    categoriesList.innerHTML = `<div class="upload-status">couldn't load categories: ${escapeHtml(catErr.message)}</div>`;
                    return;
                }
                categoriesList.innerHTML = (cats || []).map(c => `
                <div class="category-row" data-slug="${escapeHtml(c.slug)}">
                  <span class="cat-name">${escapeHtml(c.name)}</span>
                  <span class="cat-slug">/${escapeHtml(c.slug)}</span>
                  <button type="button" data-remove-cat="${escapeHtml(c.slug)}" title="Delete">✕</button>
                </div>
              `).join('') || '<div class="upload-status">no categories yet.</div>';

                categoriesList.querySelectorAll('[data-remove-cat]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm(`Delete category "${btn.dataset.removeCat}"? Posts using it will keep the old value.`)) return;
                        await supabase.from('categories').delete().eq('slug', btn.dataset.removeCat);
                        renderCategories();
                        loadCategoryOptions();
                    });
                });
            }
            renderCategories();

            document.getElementById('add-category-btn').addEventListener('click', async () => {
                const name = newCategoryInput.value.trim();
                if (!name) return;
                const slug = slugify(name);
                const { error: addErr } = await supabase.from('categories').insert({ slug, name });
                if (addErr) {
                    alert('Could not add category: ' + addErr.message);
                    return;
                }
                newCategoryInput.value = '';
                renderCategories();
                loadCategoryOptions();
            });

            document.getElementById('settings-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                errEl.textContent = '';
                statusEl.textContent = '';
                const saveBtn = document.getElementById('settings-save-btn');
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Saving…';

                if (pendingLogoFile) {
                    logoStatus.textContent = 'uploading logo…';
                    try {
                        settings.logo_url = await uploadToStorage(pendingLogoFile, 'branding');
                        pendingLogoFile = null;
                        logoStatus.textContent = '';
                    } catch (uploadErr) {
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = 'Save settings';
                        logoStatus.textContent = '';
                        errEl.textContent = 'Logo upload failed: ' + uploadErr.message;
                        return;
                    }
                }

                settings.site_name = nameInput.value.trim() || DEFAULT_SETTINGS.site_name;
                settings.nav_links = settings.nav_links.filter(l => (l.label || '').trim());

                const { error: saveError } = await supabase.from('settings')
                    .upsert({ id: 'site', value: settings });

                saveBtn.disabled = false;
                saveBtn.innerHTML = 'Save settings';

                if (saveError) {
                    errEl.textContent = saveError.message;
                    return;
                }

                renderLogoPreview();
                renderNavLinks();
                statusEl.textContent = '✓ Saved. Changes will show on the live site.';
                setTimeout(() => { statusEl.textContent = ''; }, 4000);
            });
        }

        // ─── BOOT ──────────────────────────────────────────
        (async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                renderDashboard();
            } else {
                renderLogin();
            }
        })();

        supabase.auth.onAuthStateChange((event) => {
            if (event === 'SIGNED_OUT') renderLogin();
        });
    </script>
</body>
</html>
