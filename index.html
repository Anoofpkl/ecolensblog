<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECOLENS</title>
    <meta name="description" content="Economy, markets, policy, tech and culture — clearly explained." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('ecolens-theme');
                var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <style>
        /* ── reset & base (matches admin template) ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0e;
            --bg-secondary: #111118;
            --bg-card: #16161f;
            --bg-card-hover: #1c1c28;
            --border: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.12);
            --text: #f0ede8;
            --text-secondary: rgba(240, 237, 232, 0.65);
            --text-tertiary: rgba(240, 237, 232, 0.35);
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.25);
            --lime: #c9ff3d;
            --lime-glow: rgba(201, 255, 61, 0.15);
            --coral: #ff6b4a;
            --coral-glow: rgba(255, 107, 74, 0.15);
            --cyan: #5bd8ff;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        :root[data-theme="light"] {
            --bg: #f7f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f5;
            --border: #e4e4ec;
            --border-strong: #cfcfdb;
            --text: #14141a;
            --text-secondary: #4a4a58;
            --text-tertiary: #84848f;
            --accent: #6c3ce0;
            --accent-glow: rgba(108, 60, 224, 0.1);
            --lime: #5c8a00;
            --lime-glow: rgba(92, 138, 0, 0.1);
            --coral: #d6492c;
            --coral-glow: rgba(214, 73, 44, 0.1);
            --cyan: #0077be;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
            transition: background var(--transition), color var(--transition);
        }

        a { color: inherit; text-decoration: none; }
        ::selection { background: var(--accent); color: #fff; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 24px 100px; }

        /* ── topbar ── */
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 22px; margin-bottom: 12px; flex-wrap: wrap; gap: 14px;
        }
        .brand-group { display: flex; align-items: center; gap: 10px; }
        .brand-logo { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; }
        .brand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
        .brand .dot { color: var(--lime); }

        .nav-links { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .nav-links a {
            font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.02em;
            color: var(--text-secondary); padding: 8px 14px; border-radius: 999px;
            transition: background var(--transition), color var(--transition);
        }
        .nav-links a:hover { background: rgba(255,255,255,0.05); color: var(--text); }

        .topbar-actions { display: flex; align-items: center; gap: 10px; }
        .theme-toggle {
            width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border-strong);
            background: rgba(255,255,255,0.03); color: var(--text); display: flex; align-items: center;
            justify-content: center; cursor: pointer; font-size: 15px; flex-shrink: 0;
            transition: all var(--transition);
        }
        .theme-toggle:hover { border-color: var(--accent); background: var(--accent-glow); }

        .divider { height: 1px; background: var(--border); margin-bottom: 32px; }

        /* ── hero (featured post) ── */
        .hero {
            display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 40px; margin-bottom: 40px; box-shadow: var(--shadow); cursor: pointer;
            transition: border-color var(--transition);
            position: relative; overflow: hidden;
        }
        .hero::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--lime), var(--accent)); opacity: 0.6;
        }
        .hero:hover { border-color: var(--border-strong); }
        .hero-eyebrow {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--lime); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
        }
        .hero h1 {
            font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 600;
            letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 14px;
        }
        .hero p { color: var(--text-secondary); font-size: 15px; line-height: 1.6; margin-bottom: 18px; }
        .hero-meta {
            font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-tertiary);
            display: flex; gap: 14px; flex-wrap: wrap;
        }
        .hero-visual {
            aspect-ratio: 4/3; border-radius: var(--radius-sm); background: var(--bg-secondary);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            font-size: 90px; overflow: hidden;
        }
        .hero-visual img { width: 100%; height: 100%; object-fit: cover; }
        @media (max-width: 720px) { .hero { grid-template-columns: 1fr; padding: 26px; } .hero-visual { order: -1; aspect-ratio: 16/9; } }

        /* ── category filter ── */
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
        .filter-pill {
            font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-secondary);
            background: var(--bg-card); border: 1px solid var(--border); padding: 8px 16px;
            border-radius: 999px; cursor: pointer; transition: all var(--transition);
        }
        .filter-pill:hover { border-color: var(--border-strong); color: var(--text); }
        .filter-pill.active { background: var(--lime); color: #0a0a0e; border-color: var(--lime); font-weight: 500; }

        /* ── posts grid ── */
        .posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media (max-width: 860px) { .posts-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 580px) { .posts-grid { grid-template-columns: 1fr; } }

        .post-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; cursor: pointer; transition: all var(--transition); display: flex; flex-direction: column;
        }
        .post-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow); }
        .post-card .thumb {
            aspect-ratio: 16/10; background: var(--bg-secondary); display: flex; align-items: center;
            justify-content: center; font-size: 46px; border-bottom: 1px solid var(--border); overflow: hidden;
        }
        .post-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .post-card .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .post-card .tag {
            font-family: 'JetBrains Mono', monospace; font-size: 10.5px; text-transform: uppercase;
            letter-spacing: 0.06em; color: var(--accent); background: var(--accent-glow);
            padding: 3px 10px; border-radius: 999px; align-self: flex-start;
        }
        .post-card h3 {
            font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600;
            letter-spacing: -0.01em; line-height: 1.3;
        }
        .post-card .excerpt { color: var(--text-secondary); font-size: 13.5px; line-height: 1.55; flex: 1; }
        .post-card .meta {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-tertiary);
            display: flex; justify-content: space-between; align-items: center; padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .empty-state {
            text-align: center; padding: 80px 20px; color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
        }
        .empty-state .big { font-size: 40px; display: block; margin-bottom: 14px; }

        /* ── single post view ── */
        .back-link {
            font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-secondary);
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px;
            background: rgba(255,255,255,0.03); border: 1px solid transparent; margin-bottom: 28px;
            transition: all var(--transition); cursor: pointer;
        }
        .back-link:hover { color: var(--text); border-color: var(--border); background: rgba(255,255,255,0.05); }
        .back-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        article.post {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 44px; box-shadow: var(--shadow);
        }
        @media (max-width: 600px) { article.post { padding: 26px; } }

        .post .tag {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--accent); background: var(--accent-glow);
            padding: 4px 12px; border-radius: 999px; display: inline-block; margin-bottom: 18px;
        }
        .post h1 {
            font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 600;
            letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 18px;
        }
        .post-byline {
            display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }
        .post-byline .avatar {
            width: 38px; height: 38px; border-radius: 999px; background: var(--accent); color: #fff;
            display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px;
            text-transform: uppercase; flex-shrink: 0;
        }
        .post-byline .who { font-size: 13.5px; font-weight: 500; }
        .post-byline .when {
            font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-tertiary);
        }
        .post-cover { width: 100%; border-radius: var(--radius-sm); margin-bottom: 32px; border: 1px solid var(--border); }
        .post-content { font-size: 16px; line-height: 1.85; color: var(--text); }
        .post-content p { margin-bottom: 22px; }
        .post-content p:last-child { margin-bottom: 0; }
        .post-content img { width: 100%; border-radius: var(--radius-sm); margin: 8px 0 22px; border: 1px solid var(--border); }

        /* ── comments ── */
        .comments-section { margin-top: 40px; }
        .comments-section h2 {
            font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; margin-bottom: 20px;
        }
        .comment-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
        .comment-form input, .comment-form textarea {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text);
            font-family: 'Inter', sans-serif; font-size: 14.5px; padding: 12px 15px; border-radius: var(--radius-sm);
            outline: none; transition: border-color var(--transition), box-shadow var(--transition); width: 100%;
        }
        .comment-form input:focus, .comment-form textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .comment-form textarea { min-height: 90px; resize: vertical; }
        .comment-form button {
            font-family: 'Inter', sans-serif; font-weight: 600; border: none; border-radius: var(--radius-sm);
            cursor: pointer; font-size: 14px; padding: 12px 22px; background: var(--lime); color: #0a0a0e;
            width: fit-content; box-shadow: 0 4px 20px var(--lime-glow); transition: all var(--transition);
        }
        .comment-form button:hover { opacity: 0.92; transform: translateY(-1px); }
        .comment-form button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .comment-status { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--lime); min-height: 16px; }
        .comment-status.error { color: var(--coral); }

        .comment-list { display: flex; flex-direction: column; gap: 18px; }
        .comment-item { padding: 16px 18px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--radius-sm); }
        .comment-item .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .comment-item .name { font-weight: 600; font-size: 13.5px; }
        .comment-item .when { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-tertiary); }
        .comment-item .body { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

        footer {
            margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-tertiary);
            text-align: center;
        }

        .loading { text-align: center; padding: 60px 20px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <a href="index.html" class="brand-group" id="brand-link">
                <span id="brand-logo-slot"></span>
                <span class="brand" id="brand-name">ECOLENS<span class="dot">.</span></span>
            </a>
            <nav class="nav-links" id="nav-links"></nav>
            <div class="topbar-actions">
                <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌙</button>
            </div>
        </div>
        <div class="divider"></div>

        <div id="app"><div class="loading">loading…</div></div>

        <footer>
            <span id="footer-name">ECOLENS</span> · built with Supabase
        </footer>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://ojlmwlqrkbctlpexrufs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2aMsITRDeO8MfFHiWIkNzQ_JENBP08R';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const app = document.getElementById('app');
        let activeTag = null;
        let allPosts = [];

        // ── theme ──
        const themeToggle = document.getElementById('theme-toggle');
        function applyThemeIcon() {
            const theme = document.documentElement.getAttribute('data-theme') || 'dark';
            themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
        }
        applyThemeIcon();
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('ecolens-theme', next); } catch (e) {}
            applyThemeIcon();
        });

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function formatDate(d) {
            return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // ── settings (brand, logo, nav) ──
        async function loadSettings() {
            const { data } = await supabase.from('settings').select('value').eq('id', 'site').single();
            const settings = (data && data.value) || {};
            const siteName = settings.site_name || 'ECOLENS';
            document.title = siteName;
            document.getElementById('footer-name').textContent = siteName;

            const brandEl = document.getElementById('brand-name');
            brandEl.innerHTML = escapeHtml(siteName.slice(0, -1) || siteName) +
                '<span class="dot">' + escapeHtml(siteName.slice(-1) || '.') + '</span>';

            const logoSlot = document.getElementById('brand-logo-slot');
            if (settings.logo_url) {
                logoSlot.innerHTML = `<img class="brand-logo" src="${escapeHtml(settings.logo_url)}" alt="" />`;
            }

            const navEl = document.getElementById('nav-links');
            const links = Array.isArray(settings.nav_links) ? settings.nav_links : [];
            navEl.innerHTML = links.map(l =>
                `<a href="${escapeHtml(l.href || '#')}">${escapeHtml(l.label || '')}</a>`
            ).join('');
        }

        // ── categories for filter row ──
        async function loadCategoryFilters() {
            const { data: cats } = await supabase.from('categories').select('slug, name').order('sort_order', { ascending: true });
            return cats || [];
        }

        function renderFilterRow(cats) {
            const pills = [{ slug: null, name: 'All' }, ...cats];
            return `<div class="filter-row">${pills.map(c => `
                <button class="filter-pill ${activeTag === c.slug ? 'active' : ''}" data-tag="${escapeHtml(c.slug || '')}">${escapeHtml(c.name)}</button>
            `).join('')}</div>`;
        }

        // ── list view ──
        async function renderList() {
            history.replaceState({}, '', window.location.pathname);
            app.innerHTML = '<div class="loading">loading posts…</div>';

            const [cats, postsRes] = await Promise.all([
                loadCategoryFilters(),
                supabase.from('posts').select('id, title, slug, tag, excerpt, image_emoji, image_url, author_name, read_time, views, created_at').order('created_at', { ascending: false })
            ]);

            if (postsRes.error) {
                app.innerHTML = `<div class="empty-state"><span class="big">⚠️</span>Couldn't load posts: ${escapeHtml(postsRes.error.message)}</div>`;
                return;
            }

            allPosts = postsRes.data || [];

            if (allPosts.length === 0) {
                app.innerHTML = `<div class="empty-state"><span class="big">📭</span>No posts published yet. Check back soon.</div>`;
                return;
            }

            const [featured, ...rest] = allPosts;
            const visible = activeTag ? rest.filter(p => p.tag === activeTag) : rest;
            const showHero = !activeTag || featured.tag === activeTag;

            app.innerHTML = `
                ${showHero ? renderHero(featured) : ''}
                ${renderFilterRow(cats)}
                <div class="posts-grid">
                    ${(showHero ? visible : allPosts.filter(p => !activeTag || p.tag === activeTag))
                        .map(p => renderCard(p)).join('') || '<div class="empty-state" style="grid-column:1/-1"><span class="big">🔍</span>No posts in this category yet.</div>'}
                </div>
            `;

            wireCardClicks();
        }

        function renderHero(p) {
            const visual = p.image_url
                ? `<img src="${escapeHtml(p.image_url)}" alt="" />`
                : escapeHtml(p.image_emoji || '📰');
            return `
                <div class="hero" data-slug="${escapeHtml(p.slug)}">
                    <div>
                        <div class="hero-eyebrow">✦ Latest · ${escapeHtml(p.tag || 'econ')}</div>
                        <h1>${escapeHtml(p.title)}</h1>
                        <p>${escapeHtml(p.excerpt || '')}</p>
                        <div class="hero-meta">
                            <span>${escapeHtml(p.author_name || 'ECOLENS')}</span>
                            <span>${formatDate(p.created_at)}</span>
                            <span>${p.read_time || 5} min read</span>
                        </div>
                    </div>
                    <div class="hero-visual">${visual}</div>
                </div>
            `;
        }

        function renderCard(p) {
            const thumb = p.image_url
                ? `<img src="${escapeHtml(p.image_url)}" alt="" />`
                : escapeHtml(p.image_emoji || '📰');
            return `
                <div class="post-card" data-slug="${escapeHtml(p.slug)}">
                    <div class="thumb">${thumb}</div>
                    <div class="body">
                        <span class="tag">${escapeHtml(p.tag || 'econ')}</span>
                        <h3>${escapeHtml(p.title)}</h3>
                        <div class="excerpt">${escapeHtml(p.excerpt || '')}</div>
                        <div class="meta">
                            <span>${escapeHtml(p.author_name || 'ECOLENS')}</span>
                            <span>${formatDate(p.created_at)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function wireCardClicks() {
            document.querySelectorAll('[data-slug]').forEach(el => {
                el.addEventListener('click', () => {
                    const slug = el.dataset.slug;
                    history.pushState({}, '', `?post=${encodeURIComponent(slug)}`);
                    renderPost(slug);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        document.getElementById('brand-link').addEventListener('click', (e) => {
            e.preventDefault();
            history.pushState({}, '', window.location.pathname);
            renderList();
        });

        // ── single post view ──
        function renderContent(content) {
            if (!content) return '';
            return content.split(/\n\s*\n/).map(block => {
                const trimmed = block.trim();
                const imgMatch = trimmed.match(/^\[image:(.+?)\]$/);
                if (imgMatch) return `<img src="${escapeHtml(imgMatch[1])}" alt="" />`;
                if (!trimmed) return '';
                return `<p>${escapeHtml(trimmed).replace(/\n/g, '<br>')}</p>`;
            }).join('');
        }

        async function renderPost(slug) {
            app.innerHTML = '<div class="loading">loading…</div>';

            const { data: post, error } = await supabase.from('posts').select('*').eq('slug', slug).single();
            if (error || !post) {
                app.innerHTML = `<div class="empty-state"><span class="big">🔍</span>Post not found.</div>
                    <div style="text-align:center;margin-top:16px;"><span class="back-link" id="back-to-list">← Back to all posts</span></div>`;
                document.getElementById('back-to-list').addEventListener('click', () => {
                    history.pushState({}, '', window.location.pathname);
                    renderList();
                });
                return;
            }

            // fire-and-forget view increment
            supabase.from('posts').update({ views: (post.views || 0) + 1 }).eq('id', post.id).then(() => {});

            const initials = (post.author_name || 'EC').split(' ').map(w => w[0]).slice(0, 2).join('');

            app.innerHTML = `
                <span class="back-link" id="back-to-list">
                    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back to all posts
                </span>
                <article class="post">
                    <span class="tag">${escapeHtml(post.tag || 'econ')}</span>
                    <h1>${escapeHtml(post.title)}</h1>
                    <div class="post-byline">
                        <div class="avatar">${escapeHtml(initials)}</div>
                        <div>
                            <div class="who">${escapeHtml(post.author_name || 'ECOLENS')}</div>
                            <div class="when">${formatDate(post.created_at)} · ${post.read_time || 5} min read · 👁 ${(post.views || 0) + 1}</div>
                        </div>
                    </div>
                    ${post.image_url ? `<img class="post-cover" src="${escapeHtml(post.image_url)}" alt="" />` : ''}
                    <div class="post-content">${renderContent(post.content)}</div>
                </article>

                <div class="comments-section">
                    <h2>Comments</h2>
                    <form class="comment-form" id="comment-form">
                        <input type="text" id="c-name" placeholder="Your name" required maxlength="80" />
                        <textarea id="c-body" placeholder="Add to the discussion…" required maxlength="2000"></textarea>
                        <button type="submit">Post comment</button>
                        <div class="comment-status" id="comment-status"></div>
                    </form>
                    <div class="comment-list" id="comment-list"><div class="loading">loading comments…</div></div>
                </div>
            `;

            document.getElementById('back-to-list').addEventListener('click', () => {
                history.pushState({}, '', window.location.pathname);
                renderList();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            loadComments(post.id);

            document.getElementById('comment-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const statusEl = document.getElementById('comment-status');
                const btn = e.target.querySelector('button');
                const name = document.getElementById('c-name').value.trim();
                const body = document.getElementById('c-body').value.trim();
                if (!name || !body) return;

                btn.disabled = true;
                statusEl.classList.remove('error');
                statusEl.textContent = 'posting…';

                const { error: insertErr } = await supabase.from('comments').insert({
                    post_id: post.id, name, body, approved: false
                });

                btn.disabled = false;
                if (insertErr) {
                    statusEl.classList.add('error');
                    statusEl.textContent = insertErr.message;
                    return;
                }
                document.getElementById('comment-form').reset();
                statusEl.textContent = '✓ Thanks! Your comment is awaiting moderation.';
                setTimeout(() => { statusEl.textContent = ''; }, 5000);
            });
        }

        async function loadComments(postId) {
            const listEl = document.getElementById('comment-list');
            const { data, error } = await supabase.from('comments')
                .select('id, name, body, created_at')
                .eq('post_id', postId).eq('approved', true)
                .order('created_at', { ascending: false });

            if (error) {
                listEl.innerHTML = `<div class="comment-status error">couldn't load comments: ${escapeHtml(error.message)}</div>`;
                return;
            }
            if (!data || data.length === 0) {
                listEl.innerHTML = `<div class="comment-status" style="color:var(--text-tertiary)">No comments yet — be the first.</div>`;
                return;
            }
            listEl.innerHTML = data.map(c => `
                <div class="comment-item">
                    <div class="head">
                        <span class="name">${escapeHtml(c.name)}</span>
                        <span class="when">${formatDate(c.created_at)}</span>
                    </div>
                    <div class="body">${escapeHtml(c.body)}</div>
                </div>
            `).join('');
        }

        // ── filter row clicks (delegated, since it's re-rendered) ──
        app.addEventListener('click', (e) => {
            const pill = e.target.closest('.filter-pill');
            if (!pill) return;
            activeTag = pill.dataset.tag || null;
            renderList();
        });

        window.addEventListener('popstate', boot);

        function boot() {
            const params = new URLSearchParams(window.location.search);
            const postSlug = params.get('post');
            if (postSlug) {
                renderPost(postSlug);
            } else {
                renderList();
            }
        }

        loadSettings();
        boot();
    </script>
</body>
</html>
