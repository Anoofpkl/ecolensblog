<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECOLENS — economics through the GenZ lens</title>
    <meta name="description" content="Real economics, zero boomer energy. Fresh takes on inflation, jobs, crypto, and the culture that shapes your money." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #ffffff;
            --bg-card: #f8f8fa;
            --bg-card-hover: #f0f0f3;
            --border: #e2e2e8;
            --border-strong: #c8c8d0;
            --text: #111116;
            --text-secondary: #3a3a44;
            --text-tertiary: #7a7a88;
            --accent: #6c3ce0;
            --accent-light: #8b6cf0;
            --accent-glow: rgba(108, 60, 224, 0.08);
            --cyan: #0077be;
            --pink: #d63384;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }

        ::selection {
            background: var(--accent);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-light);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ── main wrapper ── */
        .wrap {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px 60px;
        }

        /* ── header / nav ── */
        .site-header {
            padding: 28px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            height: 44px;
            width: auto;
            display: block;
        }

        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 32px;
            letter-spacing: -0.03em;
            color: var(--text);
            line-height: 1;
        }
        .logo-text .dot {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .nav-links a {
            transition: color var(--transition);
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }
        .nav-links a:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .header-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-tertiary);
            margin-left: auto;
        }

        @media (max-width: 700px) {
            .site-header {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-links {
                gap: 14px;
                font-size: 13px;
            }
            .header-date {
                margin-left: 0;
            }
        }

        /* ── featured hero ── */
        .hero-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px 36px;
            margin-bottom: 40px;
            transition: all var(--transition);
            cursor: pointer;
            box-shadow: var(--shadow);
        }
        .hero-card:hover {
            border-color: var(--border-strong);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .hero-card .featured-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 2px 14px;
            border-radius: 999px;
            display: inline-block;
            margin-bottom: 14px;
            background: rgba(108, 60, 224, 0.05);
        }
        .hero-card .hero-emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }
        .hero-card .hero-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            display: block;
            margin-bottom: 16px;
        }
        .hero-card .hero-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.1;
            margin-bottom: 12px;
            letter-spacing: -0.01em;
            color: var(--text);
        }
        .hero-card .hero-excerpt {
            font-size: 17px;
            color: var(--text-secondary);
            max-width: 640px;
            line-height: 1.6;
        }
        .hero-card .hero-meta {
            margin-top: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-tertiary);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* ── grid feed ── */
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            text-transform: uppercase;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .feed-header #post-count {
            color: var(--text-tertiary);
            font-weight: 400;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 26px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }
        .post-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-strong);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .post-card .card-emoji {
            font-size: 28px;
            margin-bottom: 6px;
        }
        .post-card .card-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            display: block;
            margin-bottom: 12px;
        }
        .post-card .card-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            border: 1px solid rgba(108, 60, 224, 0.2);
            border-radius: 999px;
            padding: 1px 12px;
            display: inline-block;
            width: fit-content;
            margin-bottom: 10px;
            background: rgba(108, 60, 224, 0.04);
        }
        .post-card .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 19px;
            line-height: 1.3;
            margin-bottom: 6px;
            color: var(--text);
        }
        .post-card .card-excerpt {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            flex: 1;
        }
        .post-card .card-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 760px) {
            .grid-2col {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .hero-card {
                padding: 24px 20px;
            }
            .hero-card .hero-title {
                font-size: 26px;
            }
        }

        /* ── empty / loading ── */
        .empty-state {
            padding: 60px 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 16px;
            grid-column: 1 / -1;
        }
        .empty-state .big {
            font-size: 44px;
            display: block;
            margin-bottom: 14px;
        }
        .loading-state {
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 40px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            justify-content: center;
        }
        .loading-state .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 999px;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── article page ── */
        .article-wrap {
            max-width: 780px;
            margin: 0 auto;
            padding: 20px 0 60px;
        }

        .back-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            transition: color var(--transition);
            margin-bottom: 20px;
        }
        .back-btn:hover {
            color: var(--accent);
        }

        .article-header {
            margin-bottom: 28px;
        }
        .article-cover {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: var(--radius);
            display: block;
            margin-bottom: 24px;
        }
        .article-header .article-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            border: 1px solid rgba(108, 60, 224, 0.2);
            border-radius: 999px;
            padding: 2px 16px;
            display: inline-block;
            background: rgba(108, 60, 224, 0.04);
        }
        .article-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(32px, 5vw, 48px);
            line-height: 1.1;
            margin: 14px 0 16px;
            letter-spacing: -0.01em;
            color: var(--text);
        }
        .article-header .article-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        .article-header .article-meta .views {
            color: var(--text-tertiary);
        }

        .article-body {
            font-size: 18px;
            line-height: 1.85;
            color: var(--text);
            margin: 32px 0 48px;
        }
        .article-body p {
            margin-bottom: 26px;
        }

        /* ── share bar ── */
        .share-bar {
            border-top: 1px solid var(--border);
            padding-top: 28px;
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
        }
        .share-bar .share-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-right: 4px;
        }
        .share-btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
        }
        .share-btn:hover {
            background: var(--bg-card);
            border-color: var(--border-strong);
            color: var(--text);
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .share-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }
        .share-btn.tw:hover {
            border-color: #1da1f2;
            color: #1da1f2;
        }
        .share-btn.lk:hover {
            border-color: #0a66c2;
            color: #0a66c2;
        }
        .share-btn.fb:hover {
            border-color: #1877f2;
            color: #1877f2;
        }
        .share-btn.wa:hover {
            border-color: #25d366;
            color: #25d366;
        }
        .share-btn.copy:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        @media (max-width: 500px) {
            .share-btn span {
                display: none;
            }
            .share-btn {
                padding: 8px 12px;
            }
            .share-btn svg {
                width: 22px;
                height: 22px;
            }
        }

        /* ── footer ── */
        .footer {
            max-width: 1120px;
            margin: 0 auto;
            padding: 28px 24px 40px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-tertiary);
            flex-wrap: wrap;
            gap: 12px;
        }
        .footer .heart {
            color: var(--pink);
        }
        .footer .dev-credit {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .footer .dev-credit strong {
            color: var(--accent);
            font-weight: 600;
        }

        /* ── fade in ── */
        .fade-in {
            animation: fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- APP -->
    <div id="app"></div>

    <!-- FOOTER -->
    <footer class="footer">
        <span>© <span id="year"></span> <span id="site-name-footer">ECOLENS</span></span>
        <span class="dev-credit">Developed by <strong>Anoof</strong> <span class="heart">♥</span></span>
    </footer>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://ojlmwlqrkbctlpexrufs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2aMsITRDeO8MfFHiWIkNzQ_JENBP08R';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('year').textContent = new Date().getFullYear();

        const app = document.getElementById('app');

        // ─── SITE SETTINGS ──────────────────────────────────
        const DEFAULT_SETTINGS = {
            site_name: 'ECOLENS',
            logo_url: '',
            nav_links: [
                { label: 'Markets', href: '#' },
                { label: 'Policy', href: '#' },
                { label: 'Tech', href: '#' },
                { label: 'Culture', href: '#' },
                { label: 'Money', href: '#' },
            ],
        };
        let siteSettings = { ...DEFAULT_SETTINGS };

        async function loadSiteSettings() {
            try {
                const { data, error } = await supabase.from('settings').select('value').eq('id', 'site').single();
                if (!error && data && data.value) {
                    siteSettings = {
                        site_name: data.value.site_name || DEFAULT_SETTINGS.site_name,
                        logo_url: data.value.logo_url || '',
                        nav_links: Array.isArray(data.value.nav_links) && data.value.nav_links.length
                            ? data.value.nav_links : DEFAULT_SETTINGS.nav_links,
                    };
                }
            } catch (e) { /* fall back to defaults if settings table isn't set up yet */ }
            document.getElementById('site-name-footer').textContent = siteSettings.site_name;
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#39;' }[m]));
        }

        function timeAgo(dateStr) {
            const d = new Date(dateStr);
            const diff = (Date.now() - d.getTime()) / 1000;
            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            if (diff < 86400 * 30) return Math.floor(diff / 86400) + 'd ago';
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function getSlugFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('post');
        }

        // ─── SOCIAL SHARE HELPERS ───
        function getShareUrl(slug) {
            const base = window.location.origin + window.location.pathname;
            return base + '?post=' + encodeURIComponent(slug);
        }

        function shareOnTwitter(slug, title) {
            const url = getShareUrl(slug);
            const text = encodeURIComponent(title + ' — ' + siteSettings.site_name);
            window.open('https://twitter.com/intent/tweet?text=' + text + '&url=' + encodeURIComponent(url), '_blank');
        }

        function shareOnLinkedIn(slug, title) {
            const url = getShareUrl(slug);
            window.open('https://www.linkedin.com/sharing/share-offscreen/?url=' + encodeURIComponent(url), '_blank');
        }

        function shareOnFacebook(slug, title) {
            const url = getShareUrl(slug);
            window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), '_blank');
        }

        function shareOnWhatsApp(slug, title) {
            const url = getShareUrl(slug);
            const text = encodeURIComponent(title + ' — ' + siteSettings.site_name + '\n' + url);
            window.open('https://api.whatsapp.com/send?text=' + text, '_blank');
        }

        function copyLink(slug) {
            const url = getShareUrl(slug);
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.querySelector('.share-btn.copy');
                if (btn) {
                    const orig = btn.innerHTML;
                    btn.innerHTML = '✓ Copied!';
                    setTimeout(() => { btn.innerHTML = orig; }, 2000);
                }
            }).catch(() => {
                prompt('Copy this link:', url);
            });
        }

        // ─── HEADER ─────────────────────────────────────────
        function renderHeader(extra) {
            const navHtml = (siteSettings.nav_links || []).map(link =>
                `<a href="${escapeHtml(link.href || '#')}">${escapeHtml(link.label || '')}</a>`
            ).join('');
            const logoHtml = siteSettings.logo_url
                ? `<img src="${escapeHtml(siteSettings.logo_url)}" alt="${escapeHtml(siteSettings.site_name)} logo" class="logo-img" />`
                : '';
            return `
            <header class="site-header">
              <div class="logo-wrapper">
                ${logoHtml}
                <span class="logo-text">${escapeHtml(siteSettings.site_name)}<span class="dot">.</span></span>
              </div>
              <nav class="nav-links">
                ${navHtml}
              </nav>
              ${extra || ''}
            </header>
          `;
        }

        // ─── RENDER FEED ──────────────────────────────────
        async function renderFeed() {
            const { data, error } = await supabase
                .from('posts')
                .select('slug, title, excerpt, tag, image_emoji, image_url, read_time, views, created_at')
                .order('created_at', { ascending: false });

            let html = '';
            let countText = '';

            if (error) {
                html =
                    `<div class="empty-state"><span class="big">⚠️</span>couldn't load feed — ${escapeHtml(error.message)}</div>`;
            } else if (!data || data.length === 0) {
                html =
                    `<div class="empty-state"><span class="big">📭</span>no posts yet. check back soon for fresh takes.</div>`;
            } else {
                countText = data.length + (data.length === 1 ? ' post' : ' posts');

                // Hero: first post
                const hero = data[0];
                const rest = data.slice(1);

                html += `
              <div class="hero-card" data-slug="${escapeHtml(hero.slug)}">
                <span class="featured-badge">★ featured</span>
                ${hero.image_url ? `<img class="hero-image" src="${escapeHtml(hero.image_url)}" alt="" />` :
                    (hero.image_emoji ? `<span class="hero-emoji">${escapeHtml(hero.image_emoji)}</span>` : '')}
                <div class="hero-title">${escapeHtml(hero.title)}</div>
                <div class="hero-excerpt">${escapeHtml(hero.excerpt || '')}</div>
                <div class="hero-meta">
                  <span>${escapeHtml(hero.tag || 'econ')}</span>
                  <span>${escapeHtml(String(hero.read_time || 5))} min read</span>
                  <span>${timeAgo(hero.created_at)}</span>
                </div>
              </div>
            `;

                // Grid: rest of posts
                if (rest.length > 0) {
                    html += `<div class="grid-2col">`;
                    rest.forEach(post => {
                        html += `
                  <div class="post-card" data-slug="${escapeHtml(post.slug)}">
                    ${post.image_url ? `<img class="card-image" src="${escapeHtml(post.image_url)}" alt="" />` :
                        (post.image_emoji ? `<div class="card-emoji">${escapeHtml(post.image_emoji)}</div>` : '')}
                    <span class="card-tag">${escapeHtml(post.tag || 'econ')}</span>
                    <div class="card-title">${escapeHtml(post.title)}</div>
                    <div class="card-excerpt">${escapeHtml(post.excerpt || '')}</div>
                    <div class="card-meta">
                      <span>${escapeHtml(String(post.read_time || 5))} min</span>
                      <span>${timeAgo(post.created_at)}</span>
                    </div>
                  </div>
                `;
                    });
                    html += `</div>`;
                }
            }

            // Build full page with header/nav
            const today = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric',
                year: 'numeric' });

            app.innerHTML = `
            <div class="wrap fade-in">
              ${renderHeader(`<span class="header-date">${today}</span>`)}

              <div class="feed-header">
                <span>Latest stories</span>
                <span id="post-count">${countText}</span>
              </div>
              <div id="feed-list">
                ${html}
              </div>
            </div>
          `;

            // Attach click handlers for SPA navigation
            document.querySelectorAll('.hero-card, .post-card').forEach(el => {
                el.addEventListener('click', (e) => {
                    const slug = el.getAttribute('data-slug');
                    if (slug) {
                        history.pushState({}, '', '?post=' + encodeURIComponent(slug));
                        renderArticle(slug);
                    }
                });
            });
        }

        // ─── RENDER ARTICLE ──────────────────────────────
        async function renderArticle(slug) {
            app.innerHTML = `
            <div class="wrap fade-in">
              <div class="article-wrap">
                <button class="back-btn" id="back-btn">← back to feed</button>
                <div class="loading-state"><span class="spinner"></span> loading post…</div>
              </div>
            </div>
          `;

            const { data: post, error } = await supabase
                .from('posts')
                .select('*')
                .eq('slug', slug)
                .single();

            if (error || !post) {
                app.innerHTML = `
              <div class="wrap fade-in">
                <div class="article-wrap">
                  <button class="back-btn" id="back-btn">← back to feed</button>
                  <div class="empty-state"><span class="big">🔍</span>post not found — it may have been unpublished.</div>
                </div>
              </div>
            `;
                document.getElementById('back-btn').addEventListener('click', goHome);
                return;
            }

            // Increment views
            supabase.from('posts').update({ views: (post.views || 0) + 1 }).eq('slug', slug).then(() => {});

            const paragraphs = (post.content || '').split(/\n\s*\n/).filter(Boolean)
                .map(p => `<p>${escapeHtml(p)}</p>`).join('') || '<p>(this post is still cooking…)</p>';

            app.innerHTML = `
            <div class="wrap fade-in">
              <div class="article-wrap">
                <button class="back-btn" id="back-btn">← back to feed</button>

                <div class="article-header">
                  ${post.image_url ? `<img class="article-cover" src="${escapeHtml(post.image_url)}" alt="" />` : ''}
                  <span class="article-tag">${escapeHtml(post.tag || 'econ')}</span>
                  <h1>${(!post.image_url && post.image_emoji) ? post.image_emoji + ' ' : ''}${escapeHtml(post.title)}</h1>
                  <div class="article-meta">
                    <span>${timeAgo(post.created_at)}</span>
                    <span>· ${escapeHtml(String(post.read_time || 5))} min read</span>
                    <span class="views">👁 ${escapeHtml(String(post.views || 0))}</span>
                  </div>
                </div>

                <div class="article-body">
                  ${paragraphs}
                </div>

                <!-- SOCIAL SHARE BAR -->
                <div class="share-bar">
                  <span class="share-label">Share</span>
                  <div class="share-btn-group">
                    <button class="share-btn tw" data-share="twitter">
                      <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                      <span>Tweet</span>
                    </button>
                    <button class="share-btn lk" data-share="linkedin">
                      <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                      <span>LinkedIn</span>
                    </button>
                    <button class="share-btn fb" data-share="facebook">
                      <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                      <span>Facebook</span>
                    </button>
                    <button class="share-btn wa" data-share="whatsapp">
                      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                      <span>WhatsApp</span>
                    </button>
                    <button class="share-btn copy" data-share="copy">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                      <span>Copy link</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;

            // ── back ──
            document.getElementById('back-btn').addEventListener('click', goHome);

            // ── share handlers ──
            document.querySelectorAll('.share-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.dataset.share;
                    switch (type) {
                        case 'twitter':
                            shareOnTwitter(slug, post.title);
                            break;
                        case 'linkedin':
                            shareOnLinkedIn(slug, post.title);
                            break;
                        case 'facebook':
                            shareOnFacebook(slug, post.title);
                            break;
                        case 'whatsapp':
                            shareOnWhatsApp(slug, post.title);
                            break;
                        case 'copy':
                            copyLink(slug);
                            break;
                    }
                });
            });

            document.title = post.title + ' — ' + siteSettings.site_name;
            window.scrollTo(0, 0);
        }

        // ─── ROUTING ──────────────────────────────────────
        function goHome(e) {
            if (e) e.preventDefault();
            history.pushState({}, '', window.location.pathname);
            route();
        }

        function route() {
            const slug = getSlugFromUrl();
            if (slug) {
                renderArticle(slug);
            } else {
                document.title = siteSettings.site_name + ' — economics through the GenZ lens';
                renderFeed();
            }
        }

        window.addEventListener('popstate', route);
        loadSiteSettings().then(route);
    </script>
</body>
</html>
