<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECOLENS</title>
    <meta name="description" content="Economy, markets, policy, tech and culture — clearly explained." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('ecolens-theme');
                var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0e;
            --bg-secondary: #111118;
            --bg-card: #16161f;
            --bg-card-hover: #1c1c28;
            --border: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.12);
            --text: #f0ede8;
            --text-secondary: rgba(240, 237, 232, 0.65);
            --text-tertiary: rgba(240, 237, 232, 0.35);
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.25);
            --lime: #c9ff3d;
            --lime-glow: rgba(201, 255, 61, 0.15);
            --coral: #ff6b4a;
            --coral-glow: rgba(255, 107, 74, 0.15);
            --cyan: #5bd8ff;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --a11y-bg: #1a1a24;
            --a11y-text: #f0ede8;
            --a11y-border: rgba(255, 255, 255, 0.12);
            --gradient-start: #764ba2;
            --gradient-end: #9333ea;
            --brand-whatsapp: #25D366;
            --brand-facebook: #1877F2;
            --brand-linkedin: #0A66C2;
        }

        :root[data-theme="light"] {
            --bg: #f7f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f5;
            --border: #e4e4ec;
            --border-strong: #cfcfdb;
            --text: #14141a;
            --text-secondary: #4a4a58;
            --text-tertiary: #84848f;
            --accent: #6c3ce0;
            --accent-glow: rgba(108, 60, 224, 0.1);
            --lime: #5c8a00;
            --lime-glow: rgba(92, 138, 0, 0.1);
            --coral: #d6492c;
            --coral-glow: rgba(214, 73, 44, 0.1);
            --cyan: #0077be;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --a11y-bg: #ffffff;
            --a11y-text: #14141a;
            --a11y-border: #e4e4ec;
            --gradient-start: #764ba2;
            --gradient-end: #9333ea;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
            transition: background var(--transition), color var(--transition);
        }

        a {
            color: inherit;
            text-decoration: none;
        }
        ::selection {
            background: var(--accent);
            color: #fff;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 28px 24px 100px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 22px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 14px;
        }
        .brand-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
        }
        .brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.02em;
        }
        .brand .dot {
            color: var(--lime);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .nav-links a {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.02em;
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 999px;
            transition: background var(--transition), color var(--transition);
        }
        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            flex-shrink: 0;
            transition: all var(--transition);
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 32px;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 32px;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: border-color var(--transition);
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--lime), var(--accent));
            opacity: 0.6;
        }
        .hero:hover {
            border-color: var(--border-strong);
        }
        .hero-eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--lime);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 34px;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 14px;
        }
        .hero p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 18px;
        }
        .hero-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: var(--text-tertiary);
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .hero-visual {
            aspect-ratio: 4/3;
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            overflow: hidden;
        }
        .hero-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @media (max-width: 720px) {
            .hero {
                grid-template-columns: 1fr;
                padding: 26px;
            }
            .hero-visual {
                order: -1;
                aspect-ratio: 16/9;
            }
        }

        .filter-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .filter-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 999px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .filter-pill:hover {
            border-color: var(--border-strong);
            color: var(--text);
        }
        .filter-pill.active {
            background: var(--lime);
            color: #0a0a0e;
            border-color: var(--lime);
            font-weight: 500;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        @media (max-width: 860px) {
            .posts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 580px) {
            .posts-grid {
                grid-template-columns: 1fr;
            }
        }

        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
        }
        .post-card:hover {
            border-color: var(--border-strong);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .post-card .thumb {
            aspect-ratio: 16/10;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
        }
        .post-card .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .post-card .body {
            padding: 18px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }
        .post-card .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 3px 10px;
            border-radius: 999px;
            align-self: flex-start;
        }
        .post-card h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }
        .post-card .excerpt {
            color: var(--text-secondary);
            font-size: 13.5px;
            line-height: 1.55;
            flex: 1;
        }
        .post-card .meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }
        .empty-state .big {
            font-size: 40px;
            display: block;
            margin-bottom: 14px;
        }

        .back-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            margin-bottom: 28px;
            transition: all var(--transition);
            cursor: pointer;
        }
        .back-link:hover {
            color: var(--text);
            border-color: var(--border);
            background: rgba(255, 255, 255, 0.05);
        }
        .back-link svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        article.post {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 44px;
            box-shadow: var(--shadow);
        }
        @media (max-width: 600px) {
            article.post {
                padding: 26px;
            }
        }

        .post .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 4px 12px;
            border-radius: 999px;
            display: inline-block;
            margin-bottom: 18px;
        }
        .post h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 18px;
        }
        .post-byline {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }
        .post-byline .avatar {
            width: 38px;
            height: 38px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .post-byline .who {
            font-size: 13.5px;
            font-weight: 500;
        }
        .post-byline .when {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: var(--text-tertiary);
        }
        .post-cover {
            width: 100%;
            border-radius: var(--radius-sm);
            margin-bottom: 32px;
            border: 1px solid var(--border);
        }
        .post-content {
            font-size: 16px;
            line-height: 1.85;
            color: var(--text);
        }
        .post-content p {
            margin-bottom: 22px;
        }
        .post-content p:last-child {
            margin-bottom: 0;
        }
        .post-content img {
            width: 100%;
            border-radius: var(--radius-sm);
            margin: 8px 0 22px;
            border: 1px solid var(--border);
        }

        .share-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid var(--border);
        }
        .share-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-tertiary);
            margin-right: 4px;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .share-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .share-btn.brand-icon svg {
            fill: currentColor;
            stroke: none;
        }
        .share-btn[data-share="whatsapp"] {
            color: var(--brand-whatsapp);
            border-color: color-mix(in srgb, var(--brand-whatsapp) 40%, var(--border));
        }
        .share-btn[data-share="facebook"] {
            color: var(--brand-facebook);
            border-color: color-mix(in srgb, var(--brand-facebook) 40%, var(--border));
        }
        .share-btn[data-share="linkedin"] {
            color: var(--brand-linkedin);
            border-color: color-mix(in srgb, var(--brand-linkedin) 40%, var(--border));
        }
        .share-btn[data-share="twitter"] {
            color: var(--text);
        }
        .share-btn:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }
        .share-btn[data-share="whatsapp"]:hover,
        .share-btn[data-share="facebook"]:hover,
        .share-btn[data-share="linkedin"]:hover,
        .share-btn[data-share="twitter"]:hover {
            background: color-mix(in srgb, currentColor 12%, transparent);
            border-color: currentColor;
        }
        .share-btn.copied {
            border-color: var(--lime) !important;
            color: var(--lime) !important;
            background: var(--lime-glow) !important;
        }

        .comments-section {
            margin-top: 40px;
        }
        .comments-section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }
        .comment-form input,
        .comment-form textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            padding: 12px 15px;
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            width: 100%;
        }
        .comment-form input:focus,
        .comment-form textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .comment-form textarea {
            min-height: 90px;
            resize: vertical;
        }
        .comment-form button {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            padding: 12px 22px;
            background: var(--lime);
            color: #0a0a0e;
            width: fit-content;
            box-shadow: 0 4px 20px var(--lime-glow);
            transition: all var(--transition);
        }
        .comment-form button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .comment-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .comment-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: var(--lime);
            min-height: 16px;
        }
        .comment-status.error {
            color: var(--coral);
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .comment-item {
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .comment-item .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .comment-item .name {
            font-weight: 600;
            font-size: 13.5px;
        }
        .comment-item .when {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-tertiary);
        }
        .comment-item .body {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        footer {
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: var(--text-tertiary);
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .site-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            padding: 10px 4px;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }
        .site-nav a {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: 999px;
            transition: all var(--transition);
        }
        .site-nav a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }
        .site-nav a.active {
            background: var(--lime);
            color: #0a0a0e;
            font-weight: 500;
        }

        .marquee-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            background: var(--accent-glow);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 9px 0;
            margin-bottom: 24px;
        }
        .marquee-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--bg);
            background: var(--lime);
            padding: 4px 12px;
            border-radius: 999px;
            flex-shrink: 0;
            margin-left: 12px;
            font-weight: 600;
        }
        .marquee-track {
            overflow: hidden;
            flex: 1;
        }
        .marquee-content {
            display: flex;
            align-items: center;
            white-space: nowrap;
            width: max-content;
            animation: marquee-scroll 28s linear infinite;
        }
        .marquee-bar:hover .marquee-content {
            animation-play-state: paused;
        }
        .marquee-content span,
        .marquee-content a {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: var(--text);
            padding: 0 28px;
            flex-shrink: 0;
            text-decoration: none;
        }
        .marquee-content a:hover {
            color: var(--lime);
            text-decoration: underline;
        }
        @keyframes marquee-scroll {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-50%);
            }
        }

        .footer-social {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .footer-social .social-icon-link {
            display: inline-flex;

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://ojlmwlqrkbctlpexrufs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2aMsITRDeO8MfFHiWIkNzQ_JENBP08R';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const app = document.getElementById('app');
        let activeTag = null;
        let allPosts = [];
        let categoriesCache = [];

        const themeToggle = document.getElementById('theme-toggle');
        function applyThemeIcon() {
            const theme = document.documentElement.getAttribute('data-theme') || 'dark';
            themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
        }
        applyThemeIcon();
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('ecolens-theme', next); } catch (e) {}
            applyThemeIcon();
        });

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function formatDate(d) {
            return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDateTime(d) {
            return new Date(d).toLocaleString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
            });
        }

        async function loadSettings() {
            const { data } = await supabase.from('settings').select('value').eq('id', 'site').single();
            const settings = (data && data.value) || {};
            const siteName = settings.site_name || 'ECOLENS';
            document.title = siteName;
            document.getElementById('footer-name').textContent = siteName;

            const footerNoteEl = document.getElementById('footer-note');
            footerNoteEl.textContent = settings.footer_text ? ` · ${settings.footer_text}` : '';

            const brandEl = document.getElementById('brand-name');
            brandEl.innerHTML = escapeHtml(siteName.slice(0, -1) || siteName) +
                '<span class="dot">' + escapeHtml(siteName.slice(-1) || '.') + '</span>';

            const logoSlot = document.getElementById('brand-logo-slot');
            if (settings.logo_url) {
                logoSlot.innerHTML = `<img class="brand-logo" src="${escapeHtml(settings.logo_url)}" alt="" />`;
            }

            const navEl = document.getElementById('nav-links');
            const links = Array.isArray(settings.nav_links) ? settings.nav_links : [];
            navEl.innerHTML = links.map(l =>
                `<a href="${escapeHtml(l.href || '#')}">${escapeHtml(l.label || '')}</a>`
            ).join('');

            const marqueeBar = document.getElementById('marquee-bar');
            const marqueeContent = document.getElementById('marquee-content');
            const marqueeItems = Array.isArray(settings.marquee_items) && settings.marquee_items.length
                ? settings.marquee_items
                : (settings.marquee_text || '').split('•').map(s => s.trim()).filter(Boolean).map(t => ({ type: 'custom', label: t, url: '' }));

            if (settings.marquee_enabled && marqueeItems.length) {
                const html = marqueeItems.map(item => {
                    if (item.type === 'post' && item.slug) {
                        return `<a href="?post=${encodeURIComponent(item.slug)}" data-marquee-post="${escapeHtml(item.slug)}">📰 ${escapeHtml(item.label)}</a>`;
                    }
                    if (item.url) {
                        return `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.label)}</a>`;
                    }
                    return `<span>${escapeHtml(item.label)}</span>`;
                }).join('');
                marqueeContent.innerHTML = html + html;
                marqueeContent.querySelectorAll('[data-marquee-post]').forEach(a => {
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        const slug = a.dataset.marqueePost;
                        history.pushState({}, '', `?post=${encodeURIComponent(slug)}`);
                        renderPost(slug);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                });
                marqueeBar.style.display = 'flex';
            } else {
                marqueeBar.style.display = 'none';
            }
        }

        async function loadCategoryFilters() {
            if (categoriesCache.length) return categoriesCache;
            const { data: cats } = await supabase.from('categories').select('slug, name').order('sort_order', { ascending: true });
            categoriesCache = cats || [];
            return categoriesCache;
        }

        function renderFilterRow(cats) {
            const pills = [{ slug: null, name: 'All' }, ...cats];
            return `<div class="filter-row">${pills.map(c => `
                <button class="filter-pill ${activeTag === c.slug ? 'active' : ''}" data-tag="${escapeHtml(c.slug || '')}">${escapeHtml(c.name)}</button>
            `).join('')}</div>`;
        }

        async function renderSiteNav() {
            const cats = await loadCategoryFilters();
            const navEl = document.getElementById('site-nav');
            const items = [{ slug: null, name: 'Home' }, ...cats];
            navEl.innerHTML = items.map(c =>
                `<a href="#" data-nav-tag="${escapeHtml(c.slug || '')}" class="${activeTag === c.slug ? 'active' : ''}">${escapeHtml(c.name)}</a>`
            ).join('');
            navEl.querySelectorAll('[data-nav-tag]').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    activeTag = a.dataset.navTag || null;
                    const url = activeTag ? `?tag=${encodeURIComponent(activeTag)}` : window.location.pathname;
                    history.pushState({}, '', url);
                    renderList();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        function updateActiveNav() {
            document.querySelectorAll('#site-nav [data-nav-tag]').forEach(a => {
                a.classList.toggle('active', (a.dataset.navTag || null) === activeTag);
            });
        }

        async function renderList() {
            updateActiveNav();
            app.innerHTML = '<div class="loading">loading posts…</div>';

            const [cats, postsRes] = await Promise.all([
                loadCategoryFilters(),
                supabase.from('posts').select('id, title, slug, tag, excerpt, image_emoji, image_url, author_name, read_time, views, created_at').order('created_at', { ascending: false })
            ]);

            if (postsRes.error) {
                app.innerHTML = `<div class="empty-state"><span class="big">⚠️</span>Couldn't load posts: ${escapeHtml(postsRes.error.message)}</div>`;
                return;
            }

            allPosts = postsRes.data || [];

            if (allPosts.length === 0) {
                app.innerHTML = `<div class="empty-state"><span class="big">📭</span>No posts published yet. Check back soon.</div>`;
                return;
            }

            const [featured, ...rest] = allPosts;
            const visible = activeTag ? rest.filter(p => p.tag === activeTag) : rest;
            const showHero = !activeTag || featured.tag === activeTag;

            app.innerHTML = `
                ${showHero ? renderHero(featured) : ''}
                ${renderFilterRow(cats)}
                <div class="posts-grid">
                    ${(showHero ? visible : allPosts.filter(p => !activeTag || p.tag === activeTag))
                        .map(p => renderCard(p)).join('') || '<div class="empty-state" style="grid-column:1/-1"><span class="big">🔍</span>No posts in this category yet.</div>'}
                </div>
            `;

            wireCardClicks();
        }

        function renderHero(p) {
            const visual = p.image_url
                ? `<img src="${escapeHtml(p.image_url)}" alt="" />`
                : escapeHtml(p.image_emoji || '📰');
            return `
                <div class="hero" data-slug="${escapeHtml(p.slug)}">
                    <div>
                        <div class="hero-eyebrow">✦ Latest · ${escapeHtml(p.tag || 'econ')}</div>
                        <h1>${escapeHtml(p.title)}</h1>
                        <p>${escapeHtml(p.excerpt || '')}</p>
                        <div class="hero-meta">
                            <span>${escapeHtml(p.author_name || 'ECOLENS')}</span>
                            <span>${formatDateTime(p.created_at)}</span>
                            <span>${p.read_time || 5} min read</span>
                        </div>
                    </div>
                    <div class="hero-visual">${visual}</div>
                </div>
            `;
        }

        function renderCard(p) {
            const thumb = p.image_url
                ? `<img src="${escapeHtml(p.image_url)}" alt="" />`
                : escapeHtml(p.image_emoji || '📰');
            return `
                <div class="post-card" data-slug="${escapeHtml(p.slug)}">
                    <div class="thumb">${thumb}</div>
                    <div class="body">
                        <span class="tag">${escapeHtml(p.tag || 'econ')}</span>
                        <h3>${escapeHtml(p.title)}</h3>
                        <div class="excerpt">${escapeHtml(p.excerpt || '')}</div>
                        <div class="meta">
                            <span>${escapeHtml(p.author_name || 'ECOLENS')}</span>
                            <span>${formatDateTime(p.created_at)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function wireCardClicks() {
            document.querySelectorAll('[data-slug]').forEach(el => {
                el.addEventListener('click', () => {
                    const slug = el.dataset.slug;
                    history.pushState({}, '', `?post=${encodeURIComponent(slug)}`);
                    renderPost(slug);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        document.getElementById('brand-link').addEventListener('click', (e) => {
            e.preventDefault();
            history.pushState({}, '', window.location.pathname);
            renderList();
        });

        function renderContent(post) {
            const content = post.content;
            if (!content) return '';
            if (post.is_html) {
                return content;
            }
            return content.split(/\n\s*\n/).map(block => {
                const trimmed = block.trim();
                const imgMatch = trimmed.match(/^\[image:(.+?)\]$/);
                if (imgMatch) return `<img src="${escapeHtml(imgMatch[1])}" alt="" />`;
                if (!trimmed) return '';
                return `<p>${escapeHtml(trimmed).replace(/\n/g, '<br>')}</p>`;
            }).join('');
        }

        async function renderPost(slug) {
            app.innerHTML = '<div class="loading">loading…</div>';

            const { data: post, error } = await supabase.from('posts').select('*').eq('slug', slug).single();

                app.innerHTML = `<div class="empty-state"><span class="big">🔍</span>Post not found.</div>
                    <div style="text-align:center;margin-top:16px;"><span class="back-link" id="back-to-list">← Back to all posts</span></div>`;
                document.getElementById('back-to-list').addEventListener('click', () => {
                    history.pushState({}, '', window.location.pathname);
                    renderList();
                });
                return;
            }

            supabase.from('posts').update({ views: (post.views || 0) + 1 }).eq('id', post.id).then(() => {});

                        <div>

                            <div class="when">${formatDateTime(post.created_at)} · ${post.read_time || 5} min read · 👁 ${(post.views || 0) + 1}</div>
                        </div>
                    </div>
                    ${post.image_url ? `<img class="post-cover" src="${escapeHtml(post.image_url)}" alt="" />` : ''}
                    <div class="post-content">${renderContent(post)}</div>

                    <div class="share-row" id="share-row">
                        <span class="share-label">Share</span>
                        <button class="share-btn" data-share="copy">

                            Copy link
                        </button>
                        <button class="share-btn brand-icon" data-share="whatsapp">
                            <svg viewBox="0 0 512 512" fill="currentColor"><path d="M 469.257812 250.492188 C 469.257812 365.242188 375.507812 458.269531 259.839844 458.269531 C 223.132812 458.269531 188.652344 448.878906 158.636719 432.4375 L 42.703125 469.257812 L 80.492188 357.746094 C 61.4375 326.449219 50.460938 289.703125 50.460938 250.476562 C 50.476562 135.726562 144.199219 42.703125 259.867188 42.703125 C 375.523438 42.730469 469.257812 135.742188 469.257812 250.492188 Z M 259.824219 75.832031 C 162.753906 75.832031 83.789062 154.199219 83.789062 250.535156 C 83.789062 288.757812 96.253906 324.140625 117.324219 352.933594 L 95.347656 417.792969 L 162.976562 396.304688 C 190.792969 414.550781 224.078125 425.179688 259.824219 425.179688 C 356.898438 425.179688 435.886719 346.828125 435.886719 250.492188 C 435.917969 154.199219 356.910156 75.832031 259.824219 75.832031 Z M 365.589844 298.355469 C 364.285156 296.253906 360.863281 294.972656 355.742188 292.414062 C 350.636719 289.855469 325.367188 277.546875 320.679688 275.875 C 315.949219 274.164062 312.527344 273.304688 309.105469 278.40625 C 305.726562 283.511719 295.878906 294.972656 292.859375 298.394531 C 289.867188 301.804688 286.878906 302.234375 281.746094 299.71875 C 276.613281 297.128906 260.0625 291.789062 240.449219 274.445312 C 225.191406 260.925781 214.882812 244.273438 211.90625 239.167969 C 208.890625 234.078125 211.601562 231.324219 214.148438 228.792969 C 216.441406 226.5 219.28125 222.839844 221.851562 219.851562 C 224.425781 216.886719 225.273438 214.785156 226.984375 211.378906 C 228.667969 207.972656 227.820312 205.007812 226.554688 202.433594 C 225.273438 199.875 215.023438 174.839844 210.726562 164.644531 C 206.457031 154.460938 202.183594 156.144531 199.179688 156.144531 C 196.191406 156.144531 192.769531 155.726562 189.347656 155.726562 C 185.925781 155.726562 180.363281 156.964844 175.675781 162.070312 C 170.988281 167.175781 157.71875 179.484375 157.71875 204.550781 C 157.71875 229.640625 176.089844 253.832031 178.664062 257.222656 C 181.25 260.605469 214.1875 313.722656 266.363281 334.113281 C 318.5625 354.492188 318.5625 347.691406 327.964844 346.828125 C 337.398438 345.964844 358.34375 334.519531 362.601562 322.640625 C 366.882812 310.707031 366.882812 300.480469 365.589844 298.355469 Z M 365.589844 298.355469"/></svg>
                            WhatsApp
                        </button>
                        <button class="share-btn brand-icon" data-share="twitter">
                            <svg viewBox="0 0 512 512" fill="currentColor"><g transform="translate(64, 64) scale(0.75, 0.75)"><path d="M403.2 48h78.643l-171.52 196.544L512 488h-158.016l-123.744-161.248L99.136 488H10.112l183.456-210.24L0 48h161.024l111.84 148.288L403.2 48zm-27.52 417.792h43.52L138.368 68.672H91.776z"/></g></svg>
                            X / Twitter
                        </button>
                        <button class="share-btn brand-icon" data-share="facebook">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                            Facebook
                        </button>
                        <button class="share-btn brand-icon" data-share="linkedin">
                            <svg viewBox="0 0 512 512" fill="currentColor"><path d="M186.4 142.4c0 19-15.3 34.5-34.2 34.5 -18.9 0-34.2-15.4-34.2-34.5 0-19 15.3-34.5 34.2-34.5C171.1 107.9 186.4 123.4 186.4 142.4zM181.4 201.3h-57.8V388.1h57.8V201.3zM273.8 201.3h-55.4V388.1h55.4c0 0 0-69.3 0-98 0-26.3 12.1-41.9 35.2-41.9 21.3 0 31.5 15 31.5 41.9 0 26.9 0 98 0 98h57.5c0 0 0-68.2 0-118.3 0-50-28.3-74.2-68-74.2 -39.6 0-56.3 30.9-56.3 30.9v-25.2H273.8z"/></svg>
                            LinkedIn
                        </button>
                        <button class="share-btn" data-share="email">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>
                            Email
                        </button>
                    </div>
                </article>

                <div class="comments-section">
                    <h2>Comments</h2>
                    <form class="comment-form" id="comment-form">
                        <input type="text" id="c-name" placeholder="Your name" required maxlength="80" />
                        <textarea id="c-body" placeholder="Add to the discussion…" required maxlength="2000"></textarea>
                        <button type="submit">Post comment</button>
                        <div class="comment-status" id="comment-status"></div>
                    </form>
                    <div class="comment-list" id="comment-list"><div class="loading">loading comments…</div></div>
                </div>
            `;

            document.getElementById('back-to-list').addEventListener('click', () => {
                history.pushState({}, '', window.location.pathname);
                renderList();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            wireShare(document.getElementById('share-row'), () => ({
                url: `${window.location.origin}${window.location.pathname}?post=${encodeURIComponent(post.slug)}`,
                text: post.title
            }));

            loadComments(post.id);

            document.getElementById('comment-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const statusEl = document.getElementById('comment-status');
                const btn = e.target.querySelector('button');
                const name = document.getElementById('c-name').value.trim();
                const body = document.getElementById('c-body').value.trim();
                if (!name || !body) return;

                btn.disabled = true;
                statusEl.classList.remove('error');
                statusEl.textContent = 'posting…';

                const { error: insertErr } = await supabase.from('comments').insert({
                    post_id: post.id, name, body, approved: false
                });

                btn.disabled = false;
                if (insertErr) {
                    statusEl.classList.add('error');
                    statusEl.textContent = insertErr.message;
                    return;
                }
                document.getElementById('comment-form').reset();
                statusEl.textContent = '✓ Thanks! Your comment is awaiting moderation.';
                setTimeout(() => { statusEl.textContent = ''; }, 5000);
            });
        }

        function wireShare(container, getData) {
            if (!container) return;
            container.querySelectorAll('[data-share]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const { url, text } = getData();
                    const type = btn.dataset.share;

                    if (type === 'copy') {
                        try {
                            await navigator.clipboard.writeText(url);
                        } catch (e) {
                            const tmp = document.createElement('input');
                            tmp.value = url;
                            document.body.appendChild(tmp);
                            tmp.select();
                            document.execCommand('copy');
                            tmp.remove();
                        }
                        const original = btn.innerHTML;
                        btn.classList.add('copied');
                        if (btn.textContent.trim()) btn.innerHTML = '✓ Copied';
                        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = original; }, 1800);
                        return;
                    }

                    if (type === 'email') {
                        window.location.href = `mailto:?subject=${encodeURIComponent(text)}&body=${encodeURIComponent(url)}`;
                        return;
                    }

                    const urls = {
                        whatsapp: `https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`,
                        twitter: `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`,
                        facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,
                        linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`
                    };
                    if (urls[type]) window.open(urls[type], '_blank', 'noopener,noreferrer,width=600,height=500');
                });
            });
        }

        async function loadComments(postId) {
            const listEl = document.getElementById('comment-list');
            const { data, error } = await supabase.from('comments')
                .select('id, name, body, created_at')
                .eq('post_id', postId).eq('approved', true)
                .order('created_at', { ascending: false });

            if (error) {
                listEl.innerHTML = `<div class="comment-status error">couldn't load comments: ${escapeHtml(error.message)}</div>`;
                return;
            }
            if (!data || data.length === 0) {
                listEl.innerHTML = `<div class="comment-status" style="color:var(--text-tertiary)">No comments yet — be the first.</div>`;
                return;
            }
            listEl.innerHTML = data.map(c => `
                <div class="comment-item">
                    <div class="head">
                        <span class="name">${escapeHtml(c.name)}</span>
                        <span class="when">${formatDateTime(c.created_at)}</span>
                    </div>
                    <div class="body">${escapeHtml(c.body)}</div>
                </div>
            `).join('');
        }

        app.addEventListener('click', (e) => {
            const pill = e.target.closest('.filter-pill');
            if (!pill) return;
            activeTag = pill.dataset.tag || null;
            const url = activeTag ? `?tag=${encodeURIComponent(activeTag)}` : window.location.pathname;
            history.pushState({}, '', url);
            renderList();
        });

        function wireFooterShares() {
            const footerSocial = document.getElementById('footer-social');
            if (!footerSocial) return;

            footerSocial.querySelectorAll('[data-share]').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    const type = btn.dataset.share;
                    const url = `${window.location.origin}${window.location.pathname}`;
                    const text = document.getElementById('footer-name').textContent || 'ECOLENS';

                    if (type === 'copy') {
                        try {
                            await navigator.clipboard.writeText(url);
                        } catch (err) {
                            const tmp = document.createElement('input');
                            tmp.value = url;
                            document.body.appendChild(tmp);
                            tmp.select();
                            document.execCommand('copy');
                            tmp.remove();
                        }
                        btn.classList.add('copied');
                        setTimeout(() => btn.classList.remove('copied'), 1800);
                        return;
                    }

                    if (type === 'email') {
                        window.location.href = `mailto:?subject=${encodeURIComponent(text)}&body=${encodeURIComponent(url)}`;
                        return;
                    }

                    const urls = {
                        whatsapp: `https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`,
                        twitter: `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`,
                        facebook: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,
                        linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`
                    };
                    if (urls[type]) window.open(urls[type], '_blank', 'noopener,noreferrer,width=600,height=500');
                });
            });
        }

        window.addEventListener('popstate', boot);

        function boot() {
            const params = new URLSearchParams(window.location.search);
            const postSlug = params.get('post');
            const tag = params.get('tag');
            activeTag = tag || null;
            if (postSlug) {
                renderPost(postSlug);
            } else {
                renderList();
            }
        }

        loadSettings();
        renderSiteNav();
        boot();

        setTimeout(wireFooterShares, 100);

        /* ─── ACCESSIBILITY WIDGET LOGIC ─── */
        (function a11y() {
            const BASE_FONT_SIZE = 100;
            let currentStep = 0;

            function q(id) { return document.getElementById(id); }

            const toggleBtn = q('a11y-toggle');
            const panel = q('a11y-panel');
            toggleBtn.addEventListener('click', () => {
                panel.classList.toggle('open');
            });
            document.addEventListener('click', (e) => {
                const widget = document.getElementById('a11y-widget');
                if (!widget.contains(e.target) && panel.classList.contains('open')) {
                    panel.classList.remove('open');
                }
            });

            function applyFontSize() {
                document.documentElement.style.fontSize = (BASE_FONT_SIZE + currentStep * 10) + '%';
            }
            q('a11y-font-inc').addEventListener('click', () => { currentStep = Math.min(currentStep + 1, 5);
                applyFontSize(); });
            q('a11y-font-dec').addEventListener('click', () => { currentStep = Math.max(currentStep - 1, -2);
                applyFontSize(); });
            q('a11y-font-reset').addEventListener('click', () => { currentStep = 0;
                applyFontSize(); });

            q('a11y-contrast').addEventListener('change', (e) => {
                document.body.classList.toggle('a11y-high-contrast', e.target.checked);
            });

            q('a11y-dyslexia').addEventListener('change', (e) => {
                document.body.classList.toggle('a11y-dyslexia', e.target.checked);
            });

            function getMainText() {
                const main = document.querySelector('#app') || document.body;
                return main.innerText.trim().slice(0, 4000);
            }

            function pickVoice(langCode) {
                const voices = window.speechSynthesis.getVoices();
                const exact = voices.find(v => v.lang === langCode);
                if (exact) return exact;
                const prefix = langCode.split('-')[0];
                const loose = voices.find(v => v.lang.indexOf(prefix) === 0);
                return loose || null;
            }

            let utterance = null;
            q('a11y-speak').addEventListener('click', () => {
                if (!('speechSynthesis' in window)) {
                    alert('Text-to-speech is not supported in this browser.');
                    return;
                }
                window.speechSynthesis.cancel();
                utterance = new SpeechSynthesisUtterance(getMainText());
                utterance.lang = 'en-US';
                utterance.rate = 1;
                const voice = pickVoice('en-US');
                if (voice) utterance.voice = voice;
                window.speechSynthesis.speak(utterance);
            });
            q('a11y-stop').addEventListener('click', () => {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            });

            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
                window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
            }
        })();
    </script>
