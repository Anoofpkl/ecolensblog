<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>EcoLens</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:system-ui;
}

body{
background:#f5f7fa;
}

header{
background:#111827;
color:white;
padding:20px;
position:sticky;
top:0;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:white;
padding:80px 30px;
border-radius:20px;
margin:30px 0;
}

.hero h1{
font-size:3rem;
margin-bottom:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin:30px 0;
}

.stat{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.posts{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(320px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-body{
padding:20px;
}

.tag{
background:#2563eb;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
display:inline-block;
margin-bottom:10px;
}

.card h3{
margin-bottom:10px;
}

.card p{
color:#666;
margin-bottom:15px;
}

.newsletter{
background:white;
padding:40px;
border-radius:20px;
margin-top:50px;
}

input{
padding:15px;
width:300px;
border:1px solid #ddd;
border-radius:10px;
}

button{
padding:15px 20px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

footer{
padding:50px;
text-align:center;
color:#666;
}
</style>
</head>

<body>

<header>
<div class="container">
<h2>🌍 EcoLens</h2>
</div>
</header>

<div class="container">

<section class="hero">
<h1>
Economics & Social Justice
</h1>

<p>
Research, Data Visualization,
Policy Analysis & Society
</p>
</section>

<div class="stats">

<div class="stat">
<h2 id="postCount">0</h2>
<p>Articles</p>
</div>

<div class="stat">
<h2 id="researchCount">0</h2>
<p>Research Papers</p>
</div>

<div class="stat">
<h2 id="newsletterCount">0</h2>
<p>Subscribers</p>
</div>

</div>

<h2>Latest Articles</h2>

<div class="posts" id="posts">

Loading...

</div>

<section class="newsletter">

<h2>Newsletter</h2>

<br>

<input
id="email"
placeholder="Email">

<button
onclick="subscribe()">

Subscribe

</button>

</section>

</div>

<footer>
EcoLens © 2026
</footer>

<script>

const supabase =
window.supabase.createClient(
'https://girozhmjsyrqnbhacmwc.supabase.co',
'sb_publishable_YSuvbXciPZmcIyJCwB9ElA_TrPfrQOQ'
);

async function loadStats(){

let posts =
await supabase
.from('posts')
.select('*',{count:'exact',head:true});

let research =
await supabase
.from('research_papers')
.select('*',{count:'exact',head:true});

let newsletter =
await supabase
.from('newsletter')
.select('*',{count:'exact',head:true});

document.getElementById(
'postCount'
).innerText =
posts.count||0;

document.getElementById(
'researchCount'
).innerText =
research.count||0;

document.getElementById(
'newsletterCount'
).innerText =
newsletter.count||0;

}

async function loadPosts(){

let {data,error} =
await supabase
.from('posts')
.select('*')
.eq('published',true)
.order(
'created_at',
{
ascending:false
});

const div =
document.getElementById(
'posts'
);

if(error){

div.innerHTML=
error.message;

return;

}

if(!data.length){

div.innerHTML=
"<h3>No articles yet</h3>";

return;

}

div.innerHTML='';

data.forEach(post=>{

div.innerHTML +=

`
<div class="card">

<img src="${
post.cover_image ||
'https://picsum.photos/600/400'
}">

<div class="card-body">

<div class="tag">
Article
</div>

<h3>
${post.title}
</h3>

<p>
${post.excerpt||''}
</p>

<small>
${post.views}
views •
${post.read_time}
min read
</small>

</div>

</div>
`;

});

}

async function subscribe(){

let email =
document
.getElementById(
'email'
).value;

if(!email)
return;

let {error} =
await supabase
.from('newsletter')
.insert({
email
});

if(error){

alert(error.message);

return;

}

alert(
'Subscribed!'
);

}

loadStats();
loadPosts();

</script>

</body>
</html>
